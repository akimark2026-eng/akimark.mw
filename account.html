<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <title>Akimark Account</title>

    <link rel="preconnect" href="https://jnqwvmxuieeelvukhcsq.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://jnqwvmxuieeelvukhcsq.supabase.co">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --bg-content: #0a0a0a;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --icon-grey: #8a8a8a;
            --border-subtle: rgba(255,255,255,0.06);
            --radius: 8px;
            --radius-sm: 6px;
            --radius-lg: 12px;
            --transition: 0.25s cubic-bezier(0.2,0,0,1);
            --header-h: 56px;
        }

        html, body {
            overscroll-behavior-y: contain;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar,
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-content); color: #fff; min-height: 100vh; overflow-x: hidden;
            padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px));
            user-select: none; -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        a { color: inherit; text-decoration: none; border: none; outline: none; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; outline: none; }
        img { display: block; max-width: 100%; border: none; outline: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 10px; }
        .accent-text { color: var(--accent); }

        /* ════════════════════════════════════════════════════════════
           HEADER — same as home
           ════════════════════════════════════════════════════════════ */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #080808;
            border: none;
            transition: transform 0.35s cubic-bezier(0.2,0,0,1), box-shadow 0.3s ease, background 0.3s ease;
            will-change: transform;
        }
        .header.hidden { transform: translateY(-100%); }
        .header.scrolled {
            box-shadow: 0 4px 24px rgba(0,0,0,0.55);
            background: rgba(8,8,8,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .header-row { padding: 10px 0; }
        .header .container { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .logo img { height: 36px; width: auto; object-fit: contain; }

        .header-actions { display: flex; align-items: center; gap: 8px; margin-right: 2px; padding-right: 2px; }

        .header-icon-btn {
            position: relative;
            width: 40px; height: 40px;
            border-radius: 14px;
            background: linear-gradient(145deg, #1a1a1a, #101010);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            outline: none;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
            -webkit-appearance: none;
            appearance: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 2px 8px rgba(0,0,0,0.4);
        }
        .header-icon-btn:hover { background: linear-gradient(145deg, #222, #151515); }
        .header-icon-btn:active { transform: scale(0.94); background: linear-gradient(145deg, #2a1010, #1a0808); }
        .header-icon-btn svg { width: 20px; height: 20px; stroke: var(--icon-grey); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s; }
        .header-icon-btn:hover svg { stroke: #fff; }

        .notification-badge {
            position: absolute;
            top: -4px; right: -4px;
            background: linear-gradient(135deg, #ff2d2d, #b71010);
            color: #fff;
            font-size: 0.58rem;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 10px;
            min-width: 16px;
            height: 16px;
            text-align: center;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(199,21,21,0.5);
            border: none;
        }

        /* SEARCH (drop-down from header) */
        .search-subheader { background: #0e0e0e; padding: 0; border: none; max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; }
        .search-subheader.open { max-height: 400px; overflow: visible; padding: 10px 16px; }
        .search-wrapper { position: relative; max-width: 600px; margin: 0 auto; }
        .search-wrapper input { width: 100%; padding: 11px 14px 11px 42px; border-radius: 12px; border: none; background: #1a1a1a; color: #fff; font-size: 0.9rem; outline: none; -webkit-appearance: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
        .search-wrapper input:focus { background: #202020; box-shadow: inset 0 0 0 1px rgba(199,21,21,0.5); }
        .search-wrapper svg.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--icon-grey); fill: none; stroke-width: 2; pointer-events: none; }
        .search-results { position: absolute; top: 100%; left: 0; right: 0; background: #151515; border-radius: 12px; max-height: 250px; overflow-y: auto; z-index: 1000; display: none; margin-top: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
        .search-results.visible { display: block; }
        .search-results .result-item { padding: 12px 14px; cursor: pointer; font-size: 0.9rem; color: #fff; }
        .search-results .result-item:active { background: rgba(199,21,21,0.3); }

        /* ════════════════════════════════════════════════════════════
           ACCOUNT PAGE CONTENT
           ════════════════════════════════════════════════════════════ */
        .account-page {
            padding: 20px 10px 100px;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }

        .account-card {
            background: var(--bg-surface);
            border: none;
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        /* Wallet */
        .wallet-balance {
            background: linear-gradient(135deg, rgba(199,21,21,0.12), rgba(199,21,21,0.02));
            border: none;
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 84px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .wallet-icon {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(199,21,21,0.18);
            border-radius: 50%;
        }
        .wallet-icon img { width: 24px; height: 24px; }
        .wallet-info { flex: 1; min-width: 0; }
        .wallet-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-weight: 600;
        }
        .wallet-amount {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--white);
            line-height: 1.2;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .wallet-currency {
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .add-cash-link {
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: #fff;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 10px 14px;
            border-radius: 8px;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(199,21,21,0.35);
        }
        .add-cash-link:active { transform: scale(0.95); }

        /* Account Header */
        .account-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
            min-height: 70px;
        }
        .account-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1a1a1a, #101010);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(199,21,21,0.25);
        }
        .account-avatar svg { width: 28px; height: 28px; fill: var(--icon-grey); }
        .account-title h2 {
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 3px;
            letter-spacing: -0.3px;
        }
        .account-title p {
            color: var(--white);
            font-size: 1rem;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Details */
        .account-detail { margin-bottom: 14px; }
        .account-detail-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .account-detail-value {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1a1a1a;
            border: none;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            word-break: break-all;
            min-height: 46px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .account-detail-value svg {
            width: 20px;
            height: 20px;
            fill: var(--accent);
            flex-shrink: 0;
        }
        .account-detail-value span { flex: 1; }
        .copy-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            color: var(--icon-grey);
            transition: color 0.2s, transform 0.2s;
            border-radius: 6px;
        }
        .copy-icon:hover { color: var(--accent); }
        .copy-icon:active { transform: scale(0.9); }
        .copy-icon svg { width: 18px; height: 18px; fill: currentColor; }

        /* Actions */
        .account-actions {
            display: flex;
            gap: 12px;
            margin-top: 26px;
        }
        .btn-accent {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 13px 20px;
            border-radius: 10px;
            border: none;
            flex: 1;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(199,21,21,0.35);
            letter-spacing: 0.3px;
        }
        .btn-accent:active { transform: scale(0.97); }
        .btn-accent svg { width: 20px; height: 20px; fill: currentColor; }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #1a1a1a;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 13px 20px;
            border-radius: 10px;
            border: none;
            flex: 1;
            transition: background 0.2s, transform 0.2s;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .btn-secondary:active { transform: scale(0.97); background: #222; }

        /* Skeleton */
        .skeleton-block {
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
            border-radius: var(--radius-sm);
        }
        .skeleton-block::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .skeleton-circle { border-radius: 50%; }
        .skeleton-text { height: 12px; margin-bottom: 8px; }
        .skeleton-title { height: 18px; width: 60%; }
        .skeleton-btn { height: 44px; border-radius: 10px; width: 100%; }

        /* ════════════════════════════════════════════════════════════
           BOTTOM NAV — same as home (with Live burst)
           ════════════════════════════════════════════════════════════ */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 200;
            background: rgba(8,8,8,0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
            height: calc(60px + env(safe-area-inset-bottom, 0px));
            border: none;
            box-shadow: 0 -6px 20px rgba(0,0,0,0.5);
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--icon-grey);
            transition: color var(--transition);
            padding: 4px 8px;
            min-width: 60px;
            position: relative;
            flex: 1;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            border: none;
            outline: none;
        }
        .bottom-nav a img {
            width: 25px;
            height: 25px;
            object-fit: contain;
            filter: brightness(0) saturate(100%) invert(58%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(100%) contrast(85%);
            transition: filter var(--transition), transform var(--transition);
            border: none;
            outline: none;
            -webkit-user-drag: none;
        }
        .bottom-nav a.active img {
            filter: brightness(0) saturate(100%) invert(20%) sepia(90%) saturate(6000%) hue-rotate(352deg) brightness(90%) contrast(95%);
            transform: translateY(-1px);
        }
        .bottom-nav a.active { color: var(--accent); }
        .bottom-nav a:active { transform: scale(0.94); }

        .nav-icon-wrapper { position: relative; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; }

        .nav-badge {
            position: absolute;
            top: -6px; right: -8px;
            background: #c71515;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 50%;
            min-width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            z-index: 3;
            border: none;
            box-shadow: 0 2px 5px rgba(199,21,21,0.5);
        }

        /* LIVE BADGE — same as home */
        .live-badge {
            position: absolute;
            top: -10px; right: -16px;
            background: linear-gradient(135deg, #ff2d2d 0%, #c71515 100%);
            color: #fff;
            font-size: 0.5rem;
            font-weight: 900;
            padding: 3px 6px 3px 5px;
            border-radius: 20px;
            letter-spacing: 0.6px;
            line-height: 1;
            text-transform: uppercase;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 2px 8px rgba(199,21,21,0.6);
            animation: livePulse 1.6s ease-in-out infinite;
            pointer-events: none;
        }
        .live-badge::before {
            content: '';
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            animation: liveDot 1.2s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(255,255,255,0.9);
        }

        .live-burst {
            position: absolute;
            bottom: 100%;
            left: 50%;
            width: 1px;
            height: 1px;
            pointer-events: none;
            z-index: 4;
        }
        .live-burst span {
            position: absolute;
            bottom: 0;
            left: 0;
            font-size: 13px;
            line-height: 1;
            opacity: 0;
            transform: translate(-50%, 0);
            animation: emojiFloatUp 2.6s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.55));
            will-change: transform, opacity;
        }
        .live-burst span:nth-child(1) { animation-delay: 0s;   --tx: -14px; --tz: 1.05; }
        .live-burst span:nth-child(2) { animation-delay: 0.33s; --tx:  10px; --tz: 0.95; }
        .live-burst span:nth-child(3) { animation-delay: 0.66s; --tx: -6px;  --tz: 1.10; }
        .live-burst span:nth-child(4) { animation-delay: 0.99s; --tx:  16px; --tz: 1.00; }
        .live-burst span:nth-child(5) { animation-delay: 1.32s; --tx: -12px; --tz: 0.92; }
        .live-burst span:nth-child(6) { animation-delay: 1.65s; --tx:   8px; --tz: 1.08; }
        .live-burst span:nth-child(7) { animation-delay: 1.98s; --tx: -18px; --tz: 0.98; }
        .live-burst span:nth-child(8) { animation-delay: 2.31s; --tx:  14px; --tz: 1.03; }

        @keyframes emojiFloatUp {
            0%   { opacity: 0; transform: translate(-50%, 0) scale(0.3); }
            12%  { opacity: 1; transform: translate(-50%, -6px) scale(var(--tz, 1)); }
            70%  { opacity: 0.9; }
            100% { opacity: 0; transform: translate(calc(-50% + var(--tx, 0px)), -62px) scale(calc(var(--tz, 1) * 0.85)); }
        }
        @keyframes livePulse {
            0%, 100% { box-shadow: 0 2px 8px rgba(199,21,21,0.6), 0 0 0 0 rgba(199,21,21,0.6); }
            50% { box-shadow: 0 2px 8px rgba(199,21,21,0.6), 0 0 0 6px rgba(199,21,21,0); }
        }
        @keyframes liveDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        /* TOAST & WATERMARK */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            padding: 12px 20px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            max-width: 90%;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .toast.show { display: flex; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header" id="mainHeader">
        <div class="container header-row">
            <div class="logo">
                <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark">
            </div>
            <div class="header-actions">
                <button class="header-icon-btn" id="searchNavBtn" aria-label="Search">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
                <a href="notifications.html" class="header-icon-btn" aria-label="Notifications">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="notification-badge" id="notificationBadge">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- SEARCH (header dropdown) -->
    <div class="search-subheader" id="searchSubheader">
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" placeholder="Search movies, series, translators..." id="searchInput">
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <!-- ACCOUNT PAGE CONTENT -->
    <div class="account-page">
        <div class="account-card" id="accountCard">

            <!-- SKELETON -->
            <div id="accountSkeleton">
                <div class="wallet-balance" style="background:#1a1a1a;background-image:none;">
                    <div class="skeleton-block skeleton-circle" style="width:46px;height:46px;"></div>
                    <div style="flex:1;">
                        <div class="skeleton-text" style="width:60px;"></div>
                        <div class="skeleton-title" style="width:100px;"></div>
                    </div>
                    <div class="skeleton-block skeleton-btn" style="width:80px;height:36px;"></div>
                </div>
                <div class="account-header" style="border-bottom:1px solid var(--border-subtle);">
                    <div class="skeleton-block skeleton-circle" style="width:56px;height:56px;"></div>
                    <div style="flex:1;">
                        <div class="skeleton-text" style="width:100px;"></div>
                        <div class="skeleton-title" style="width:140px;"></div>
                    </div>
                </div>
                <div class="account-detail">
                    <div class="skeleton-text" style="width:60px;"></div>
                    <div class="skeleton-block" style="height:46px;margin-top:4px;border-radius:10px;"></div>
                </div>
                <div class="account-detail">
                    <div class="skeleton-text" style="width:80px;"></div>
                    <div class="skeleton-block" style="height:46px;margin-top:4px;border-radius:10px;"></div>
                </div>
                <div class="account-actions">
                    <div class="skeleton-block skeleton-btn" style="flex:1;"></div>
                </div>
            </div>

            <!-- REAL -->
            <div id="accountReal" style="display:none;">

                <!-- Wallet -->
                <div class="wallet-balance" id="walletContainer">
                    <div class="wallet-icon" id="walletIcon">
                        <img src="images/akimark-wallet.svg" alt="Wallet" onerror="this.style.display='none'">
                    </div>
                    <div class="wallet-info">
                        <div class="wallet-label">Wallet Balance</div>
                        <div class="wallet-amount">
                            <span id="walletValue">0.00</span>
                            <span class="wallet-currency">MK</span>
                        </div>
                    </div>
                    <a href="deposit" class="add-cash-link" id="addCashBtn">ADD CASH</a>
                </div>

                <!-- Account Header -->
                <div class="account-header" id="accountHeader">
                    <div class="account-avatar" id="accountAvatar">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <div class="account-title">
                        <h2>My Account</h2>
                        <p id="accountFullName">Loading...</p>
                    </div>
                </div>

                <!-- User ID with Copy -->
                <div class="account-detail">
                    <div class="account-detail-label">User ID</div>
                    <div class="account-detail-value">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm-8 6c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm-7 10c0-2.33 4.67-3.5 7-3.5s7 1.17 7 3.5v.5H5v-.5z"/></svg>
                        <span id="accountUserId">Loading...</span>
                        <button class="copy-icon" id="copyUserIdBtn" title="Copy User ID">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Phone -->
                <div class="account-detail">
                    <div class="account-detail-label">Phone Number</div>
                    <div class="account-detail-value">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                        <span id="accountPhone">Loading...</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="account-actions">
                    <button class="btn-accent" id="logoutBtn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 17l5-5-5-5v3H3v4h7v3zm8-14h-6v2h6v14h-6v2h6c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

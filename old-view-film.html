<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>View Film - Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --blue: #1DA1F2;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255,255,255,0.08);
            --radius: 8px;
            --radius-sm: 4px;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
            --transition: 0.2s cubic-bezier(0.2,0,0,1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary); color: #fff; line-height: 1.5; min-height: 100vh;
            overflow-x: hidden; user-select: none; -webkit-user-select: none;
        }
        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
        img { display: block; max-width: 100%; }

        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8,8,8,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle); padding: 8px 0;
        }
        .header .container {
            max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
        }
        .logo img { height: 28px; width: auto; object-fit: contain; }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 4px;
            color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
            padding: 6px 10px; border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            text-decoration: none;
        }
        .back-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .back-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

        .container { max-width: 700px; margin: 0 auto; padding: 16px 12px; }

        /* SKELETON */
        .skeleton-loader { display: none; }
        .skeleton-loader.show { display: block; }
        .skeleton-profile {
            height: 60px; border-radius: 8px; margin-bottom: 12px;
            background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite;
        }
        .skeleton-poster {
            width: 100%; height: 320px; border-radius: 8px;
            background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite; margin-bottom: 12px;
        }
        .skeleton-btn { height: 50px; border-radius: 6px; margin-bottom: 12px; width: 100%; background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
        .skeleton-line { height: 12px; border-radius: 4px; margin-bottom: 8px; background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
        .skeleton-line.short { width: 30%; }
        .skeleton-line.medium { width: 60%; }
        .skeleton-line.long { width: 90%; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* FILM DETAILS */
        .film-details { display: none; animation: fadeUp 0.3s ease; }
        .film-details.show { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* TRANSLATOR PROFILE */
        .translator-profile {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: 6px; padding: 12px; margin-bottom: 16px;
        }
        .translator-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; background: var(--bg-secondary); border: 1px solid var(--border-subtle); flex-shrink: 0; }
        .translator-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .translator-info { flex: 1; }
        .translator-name { font-size: 0.95rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
        .translator-followers { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        
        /* BLUE FOLLOW BUTTON */
        .follow-btn {
            background: var(--blue); color: #fff; border: none; border-radius: 6px;
            padding: 10px 20px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s;
        }
        .follow-btn.following { background: transparent; color: #fff; border: 1px solid var(--border-subtle); }
        .follow-btn:hover { background: #0d8bd9; color: #fff; transform: scale(1.02); }

        /* BLUE BADGE */
        .verified-badge {
            background-color: var(--blue);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 10px;
            margin-left: 2px;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .verified-badge svg { width: 8px; height: 8px; fill: currentColor; }

        /* FILM POSTER CENTERED */
        .film-poster {
            position: relative;
            border-radius: 8px; overflow: hidden;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            width: 100%;
            max-width: 600px;
            margin: 0 auto 12px;
            aspect-ratio: 16/9;
            box-shadow: var(--shadow);
        }
        .film-poster img { width: 100%; height: 100%; object-fit: cover; }

        /* WATCH NOW BUTTON WITH PRICE INSIDE */
        .watch-btn {
            width: 100%; padding: 14px 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: #fff; font-size: 1rem; font-weight: 800; border: none; border-radius: 6px;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center;
            justify-content: center; gap: 10px; text-transform: uppercase; letter-spacing: 0.3px;
            margin-bottom: 16px;
        }
        .watch-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(199,21,21,0.3); }
        .watch-btn:disabled { background: #444; cursor: not-allowed; transform: none; box-shadow: none; }
        .watch-btn .btn-spinner {
            width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .watch-btn.loading .btn-spinner { display: inline-block; }
        .watch-btn.loading { opacity: 0.8; pointer-events: none; }
        .play-icon { width: 18px; height: 18px; fill: currentColor; }

        /* FILM TITLE (ONLY) */
        .film-title {
            font-size: 1.4rem; font-weight: 800; letter-spacing: -0.3px;
            margin-bottom: 12px; text-transform: uppercase; line-height: 1.2;
            padding: 10px 0; border-bottom: 1px solid var(--border-subtle);
        }

        /* EPISODE LIST (CARDS - MINIMALIST) */
        .episodes-container {
            margin: 12px auto 16px;
            max-width: 600px;
        }
        .episodes-label {
            font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
        }
        .episodes-list {
            display: flex; flex-direction: column; gap: 8px;
        }
        .episode-item {
            display: flex; align-items: center; gap: 12px;
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: 8px; padding: 10px; cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
        }
        .episode-item:hover { background: var(--bg-secondary); transform: scale(1.01); }
        .episode-item.active { border-color: var(--accent); background: var(--bg-secondary); }
        
        .episode-thumb {
            position: relative; width: 90px; height: 55px;
            border-radius: 6px; overflow: hidden; background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .episode-thumb img { width: 100%; height: 100%; object-fit: cover; }
        
        .play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .episode-item:hover .play-overlay {
            opacity: 1;
        }
        .play-overlay svg { width: 20px; height: 20px; fill: #fff; }

        .episode-duration {
            position: absolute; bottom: 4px; right: 4px;
            background: rgba(0,0,0,0.8); color: #fff;
            font-size: 0.6rem; font-weight: 700;
            padding: 2px 4px; border-radius: 2px;
        }
        
        /* NEW: TEXT CONTAINER FOR TITLE & PRICE */
        .episode-text {
            display: flex; flex-direction: column; gap: 4px; flex: 1;
        }
        .episode-title {
            font-size: 0.9rem; font-weight: 600; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .episode-price {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            background: rgba(199,21,21,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            align-self: flex-start;
        }

        /* STATUS MESSAGE */
        .status-message { display: none; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; font-size: 0.9rem; font-weight: 600; }
        .status-message.show { display: flex; }
        .status-message.success { color: #4caf50; }
        .status-message.error { color: #ff4d4d; }
        .status-message svg { width: 18px; height: 18px; }

        /* ERROR STATE */
        .error-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; padding: 20px; }
        .error-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .error-text { color: #ff4d4d; font-size: 0.9rem; margin-bottom: 15px; }
        .error-btn { padding: 8px 16px; background: var(--accent); color: #fff; border-radius: 6px; font-weight: 600; font-size: 0.85rem; transition: background 0.3s; }
        .error-btn:hover { background: var(--accent-soft); }

        @media (min-width: 768px) {
            .container { padding: 24px; }
            .film-poster { max-width: 600px; margin: 0 auto 12px; }
            .watch-btn { max-width: 600px; margin: 0 auto 16px; }
            .translator-profile { margin-bottom: 16px; }
            .episodes-container { max-width: 600px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="home.html" class="logo">
                <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark Logo">
            </a>
            <div class="header-actions">
                <a href="javascript:history.back()" class="back-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>BACK</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Skeleton -->
        <div id="skeletonLoader" class="skeleton-loader">
            <div class="skeleton-profile"></div>
            <div class="skeleton-poster"></div>
            <div class="skeleton-btn"></div>
            <div class="skeleton-line long"></div>
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
        </div>

        <!-- Error -->
        <div id="errorState" class="error-state" style="display: none;">
            <div class="error-icon">⚠️</div>
            <div class="error-text" id="errorMessage">Film not found</div>
            <a href="home.html" class="error-btn">Go Back Home</a>
        </div>

        <!-- Film Details -->
        <div id="filmDetails" class="film-details">
            <!-- Translator Profile -->
            <div class="translator-profile" id="translatorProfile" style="display:none;">
                <div class="translator-avatar">
                    <img id="translatorAvatar" src="" alt="Translator Avatar">
                </div>
                <div class="translator-info">
                    <div class="translator-name">
                        <span id="translatorName">Translator</span>
                        <span class="verified-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
                    </div>
                    <div class="translator-followers" id="translatorFollowers">0 followers</div>
                </div>
                <button class="follow-btn" id="followBtn">Follow</button>
            </div>

            <!-- Film Poster -->
            <div class="film-poster">
                <img id="filmPoster" src="" alt="Film Poster">
            </div>

            <!-- WATCH NOW Button with Price Inside -->
            <button class="watch-btn" id="watchBtn">
                <span class="btn-spinner"></span>
                <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span id="watchBtnText">WATCH NOW MK 0</span>
            </button>

            <!-- ONLY TITLE (No other details) -->
            <h1 class="film-title" id="filmTitle">Loading...</h1>

            <!-- Episodes Section (only visible if series and mode is not single) -->
            <div id="episodesSection" class="episodes-container" style="display:none;">
                <div class="episodes-label">Episodes</div>
                <div class="episodes-list" id="episodesList"></div>
            </div>

            <!-- Status Message (for payment errors/success) -->
            <div id="statusMessage" class="status-message"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript.js/supabase.js"></script>
    <script src="javascript.js/view-film.js"></script>
</body>
</html>

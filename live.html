<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Live | Akimark</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg-primary: #080808;
  --bg-surface: #151515;
  --bg-elevated: #1C1C1C;
  --bg-content: #0a0a0a;
  --accent: #c71515;
  --accent-glow: #ff2d2d;
  --white: #FFFFFF;
  --text-main: #F9FAFB;
  --text-muted: #A7A7A7;
  --icon-grey: #8a8a8a;
  --border-subtle: rgba(255,255,255,0.06);
  --radius: 12px;
  --radius-lg: 18px;
  --transition-fast: 0.18s cubic-bezier(0.2,0,0,1);
  --transition: 0.28s cubic-bezier(0.2,0,0,1);
  --green: #22C55E;
  --shadow-card: 0 4px 18px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.5);
  --shadow-accent: 0 6px 24px rgba(199,21,21,0.35);
}
html, body { overscroll-behavior-y: contain; scrollbar-width: none; -ms-overflow-style: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar { display: none !important; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-content);
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px));
  user-select: none; -webkit-user-select: none;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; outline: none; }
img { display: block; max-width: 100%; border: none; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 12px; }

/* ════════ HEADER ════════ */
.header {
  position: sticky; top: 0; z-index: 100;
  background: #080808;
  transition: transform 0.35s cubic-bezier(0.2,0,0,1), box-shadow 0.3s ease, background 0.3s ease;
  will-change: transform;
}
.header.hidden { transform: translateY(-100%); }
.header.scrolled {
  box-shadow: 0 4px 24px rgba(0,0,0,0.55);
  background: rgba(8,8,8,0.92);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
}
.header-row { padding: 12px 0; }
.header .container { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo img { height: 36px; width: auto; object-fit: contain; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.header-icon-btn {
  position: relative; width: 40px; height: 40px; border-radius: 14px;
  background: linear-gradient(145deg, #1a1a1a, #101010);
  display: flex; align-items: center; justify-content: center;
  transition: transform var(--transition-fast);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 2px 8px rgba(0,0,0,0.4);
}
.header-icon-btn:active { transform: scale(0.9); }
.header-icon-btn svg { width: 20px; height: 20px; stroke: var(--icon-grey); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.header-icon-btn:hover svg { stroke: #fff; }
.notification-badge {
  position: absolute; top: -4px; right: -4px;
  background: linear-gradient(135deg, #ff2d2d, #b71010);
  color: #fff; font-size: 0.58rem; font-weight: 800;
  padding: 2px 5px; border-radius: 10px;
  min-width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(199,21,21,0.5);
}

/* ════════ PAGE ════════ */
.live-page { padding: 16px 12px 30px; animation: pageIn 0.4s ease; }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.page-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 4px; }
.page-title { font-size: 1.15rem; font-weight: 900; letter-spacing: -0.3px; }
.page-live-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #ff2d2d;
  box-shadow: 0 0 12px rgba(255,45,45,0.9);
  animation: pulseDot 1.4s ease-in-out infinite;
}
@keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }
.page-live-count {
  margin-left: auto;
  background: linear-gradient(135deg, rgba(199,21,21,0.2), rgba(199,21,21,0.08));
  color: #ff5a5a; font-size: 0.68rem; font-weight: 900;
  padding: 5px 11px; border-radius: 12px;
  letter-spacing: 0.6px; text-transform: uppercase;
  border: 1px solid rgba(199,21,21,0.2);
}

.section-head { display: flex; align-items: center; gap: 8px; margin: 24px 4px 12px; }
.section-title { font-size: 0.95rem; font-weight: 900; letter-spacing: -0.2px; text-transform: uppercase; }
.section-tag {
  background: rgba(255,255,255,0.06); color: var(--text-muted);
  font-size: 0.6rem; font-weight: 800;
  padding: 3px 8px; border-radius: 10px;
  letter-spacing: 0.5px; text-transform: uppercase;
}
.section-tag.ended { background: rgba(120,120,120,0.15); color: #9a9a9a; }

/* ════════ LIVE GRID ════════ */
.live-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 640px) { .live-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .live-grid { grid-template-columns: repeat(3, 1fr); } }

.live-card {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  overflow: hidden; position: relative;
  border: 1px solid var(--border-subtle);
  transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
  cursor: pointer;
  box-shadow: var(--shadow-card);
  animation: cardIn 0.4s cubic-bezier(0.2,0,0,1) backwards;
}
.live-card:nth-child(1) { animation-delay: 0.02s; }
.live-card:nth-child(2) { animation-delay: 0.06s; }
.live-card:nth-child(3) { animation-delay: 0.10s; }
.live-card:nth-child(4) { animation-delay: 0.14s; }
.live-card:nth-child(5) { animation-delay: 0.18s; }
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.live-card:active { transform: scale(0.975); }
.live-card:hover { border-color: rgba(255,255,255,0.1); }

.live-card.is-live::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #ff2d2d, #c71515, #ff2d2d);
  background-size: 200% 100%;
  animation: shimmer 2s linear infinite;
  z-index: 2;
}
@keyframes shimmer { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
.live-card.is-live {
  border-color: rgba(255,45,45,0.18);
  box-shadow: 0 4px 18px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,45,45,0.08);
}
.live-card.is-ended::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #3a3a3a, #2a2a2a, #3a3a3a);
  z-index: 2;
}

.live-thumb {
  position: relative; width: 100%; aspect-ratio: 16/9;
  background: #000; overflow: hidden;
}
.live-thumb-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a0505, #0a0a0a);
}
.live-thumb-placeholder svg {
  width: 48px; height: 48px;
  stroke: rgba(255,45,45,0.5);
  fill: none; stroke-width: 1.5;
  stroke-linecap: round; stroke-linejoin: round;
}
.live-card.is-ended .live-thumb-placeholder { background: linear-gradient(135deg, #0f0f0f, #0a0a0a); }
.live-card.is-ended .live-thumb-placeholder svg { stroke: rgba(120,120,120,0.5); }

/* poster image */
.live-thumb-poster {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 1;
}
.live-thumb-poster.ready { opacity: 1; }

.live-badge-card {
  position: absolute; top: 10px; left: 10px;
  background: linear-gradient(135deg, #ff2d2d, #c71515);
  color: #fff; font-size: 0.6rem; font-weight: 900;
  padding: 4px 9px 4px 7px; border-radius: 20px;
  letter-spacing: 0.8px;
  display: inline-flex; align-items: center; gap: 4px;
  text-transform: uppercase; z-index: 3;
  box-shadow: 0 4px 12px rgba(199,21,21,0.5);
}
.live-badge-card::before {
  content: ''; width: 6px; height: 6px;
  background: #fff; border-radius: 50%;
  animation: pulseDot 1.2s ease-in-out infinite;
}
.live-badge-card.ended {
  background: rgba(0,0,0,0.75); color: #cfcfcf;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
}
.live-badge-card.ended::before { display: none; }

.live-viewers {
  position: absolute; top: 10px; right: 10px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  color: #fff; font-size: 0.65rem; font-weight: 800;
  padding: 4px 9px; border-radius: 20px;
  display: inline-flex; align-items: center; gap: 4px;
  z-index: 3;
}
.live-viewers svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2; }

.live-price {
  position: absolute; bottom: 10px; right: 10px;
  font-size: 0.65rem; font-weight: 900;
  padding: 4px 10px; border-radius: 20px;
  z-index: 3; letter-spacing: 0.5px;
  text-transform: uppercase;
}
.live-price.free { background: rgba(34,197,94,0.92); color: #fff; }
.live-price.paid { background: rgba(245,158,11,0.92); color: #000; }

.live-info { padding: 12px 14px 14px; }
.live-title {
  font-size: 0.95rem; font-weight: 800; line-height: 1.3;
  margin-bottom: 6px;
  overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.live-broadcaster {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.72rem; color: var(--text-muted);
  margin-bottom: 10px;
}
.live-broadcaster .avatar {
  width: 20px; height: 20px; border-radius: 50%;
  background: linear-gradient(135deg, #c71515, #ff2d2d);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 0.6rem; font-weight: 900;
}
.live-stats-row {
  display: flex; align-items: center; gap: 12px;
  font-size: 0.7rem; color: var(--text-muted);
}
.live-stats-row span { display: inline-flex; align-items: center; gap: 4px; }
.live-stats-row svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ════════ EMPTY ════════ */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-icon {
  width: 90px; height: 90px; margin: 0 auto 16px; border-radius: 50%;
  background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.4);
}
.empty-icon svg {
  width: 44px; height: 44px; stroke: var(--accent); fill: none;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 0 10px rgba(199,21,21,0.5));
}
.empty-state h3 { color: #fff; font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
.empty-state p { font-size: 0.82rem; max-width: 320px; margin: 0 auto; line-height: 1.55; }

/* ════════ IMMERSIVE STREAM MODAL ════════ */
.stream-modal {
  position: fixed; inset: 0;
  background: #000;
  z-index: 9999;
  display: none;
  overflow: hidden;
  animation: modalIn 0.22s ease;
}
@keyframes modalIn { from { opacity: 0; } to { opacity: 1; } }
.stream-modal.open { display: block; }

.stream-stage {
  position: absolute; inset: 0;
  background: #000;
  overflow: hidden;
}
.stream-stage video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  background: #000;
}

/* full loader (only initial) */
.video-loader {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
  background: radial-gradient(circle at center, rgba(10,10,10,0.65), rgba(0,0,0,0.9));
  z-index: 6;
  transition: opacity 0.35s ease;
}
.video-loader.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 42px; height: 42px;
  border: 3px solid rgba(199,21,21,0.15);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.85s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.video-loader-text {
  color: var(--text-muted);
  font-size: 0.82rem; font-weight: 600;
  letter-spacing: 0.3px;
}

/* small buffering indicator (during playback) */
.buffering-indicator {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  z-index: 6;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.buffering-indicator.show { opacity: 1; }
.buffering-spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.buffering-indicator span {
  color: #fff; font-size: 0.75rem; font-weight: 600;
  letter-spacing: 0.3px;
}

/* top bar */
.stream-topbar {
  position: absolute; top: 0; left: 0; right: 0;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 12px;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, rgba(0,0,0,0.85), transparent);
  z-index: 10;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.stream-topbar.hide { opacity: 0; transform: translateY(-10px); pointer-events: none; }

.stream-icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(20,20,20,0.7);
  backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform var(--transition-fast), background var(--transition-fast);
}
.stream-icon-btn:active { transform: scale(0.9); background: rgba(40,40,40,0.9); }
.stream-icon-btn svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

.stream-meta { flex: 1; min-width: 0; }
.stream-title {
  font-size: 0.92rem; font-weight: 800; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.2;
}
.stream-sub {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.72rem; color: rgba(255,255,255,0.75);
  margin-top: 3px;
}
.stream-label {
  font-size: 0.58rem; font-weight: 900; letter-spacing: 0.8px;
  padding: 2px 7px; border-radius: 10px;
  background: linear-gradient(135deg, #ff2d2d, #c71515);
  color: #fff;
  display: inline-flex; align-items: center; gap: 4px;
}
.stream-label::before {
  content: ''; width: 5px; height: 5px;
  background: #fff; border-radius: 50%;
  animation: pulseDot 1.2s ease-in-out infinite;
}
.stream-label.ended { background: #2a2a2a; color: #cfcfcf; }
.stream-label.ended::before { display: none; }

.stream-views-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(20,20,20,0.7);
  backdrop-filter: blur(12px);
  padding: 7px 11px; border-radius: 20px;
  font-size: 0.72rem; font-weight: 800; color: #fff;
  flex-shrink: 0;
}
.stream-views-badge svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2.2; }

/* comments overlay (Facebook Live style) */
.comments-overlay {
  position: absolute;
  left: 12px; right: 90px;
  bottom: calc(130px + env(safe-area-inset-bottom, 0px));
  max-height: 42vh;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  gap: 6px;
  overflow: hidden;
  z-index: 8;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.comments-overlay.hide { opacity: 0; }

.comment-bubble {
  display: flex; align-items: flex-start; gap: 8px;
  background: rgba(15,15,15,0.72);
  backdrop-filter: blur(10px);
  padding: 7px 11px 7px 7px;
  border-radius: 20px;
  max-width: 78%;
  animation: commentPop 0.35s cubic-bezier(0.2,0,0,1);
  pointer-events: auto;
  align-self: flex-start;
}
@keyframes commentPop {
  from { opacity: 0; transform: translateY(8px) scale(0.94); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.comment-bubble.fade { opacity: 0; transform: translateY(-8px); transition: opacity 0.6s ease, transform 0.6s ease; }

.comment-bubble .c-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  flex-shrink: 0;
  background: linear-gradient(135deg, #c71515, #ff2d2d);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 0.6rem; font-weight: 900;
}
.comment-bubble .c-body { min-width: 0; }
.comment-bubble .c-name {
  font-size: 0.68rem; font-weight: 800;
  color: #ff6b6b;
  line-height: 1.1;
}
.comment-bubble .c-msg {
  font-size: 0.78rem; color: #fff;
  line-height: 1.3;
  word-break: break-word;
  margin-top: 1px;
}

/* reaction float layer */
.reaction-layer {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 9;
  overflow: hidden;
}
.float-heart {
  position: absolute;
  width: 34px; height: 34px;
  animation: floatUp 2.2s cubic-bezier(0.2,0.6,0.4,1) forwards;
  will-change: transform, opacity;
}
@keyframes floatUp {
  0%   { opacity: 0; transform: translateY(0) scale(0.6) rotate(0deg); }
  15%  { opacity: 1; transform: translateY(-20px) scale(1.1) rotate(-8deg); }
  100% { opacity: 0; transform: translateY(-320px) scale(0.9) rotate(15deg); }
}

/* bottom bar */
.stream-bottombar {
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  padding: 12px 12px calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(0deg, rgba(0,0,0,0.88), transparent);
  z-index: 10;
  display: flex; flex-direction: column; gap: 10px;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.stream-bottombar.hide { opacity: 0; transform: translateY(10px); pointer-events: none; }

.stream-actions {
  display: flex; align-items: center; gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.stream-actions::-webkit-scrollbar { display: none; }

.reaction-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(20,20,20,0.72);
  backdrop-filter: blur(12px);
  padding: 8px 13px 8px 10px;
  border-radius: 22px;
  font-size: 0.78rem; font-weight: 800; color: #fff;
  transition: transform var(--transition-fast), background var(--transition-fast);
  flex-shrink: 0;
}
.reaction-btn:active { transform: scale(0.94); }
.reaction-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: all 0.2s ease; }
.reaction-btn.liked {
  background: linear-gradient(135deg, #ff2d2d, #c71515);
  box-shadow: 0 4px 14px rgba(199,21,21,0.5);
}
.reaction-btn.liked svg { fill: #fff; stroke: #fff; }

.reaction-btn.icon-only {
  padding: 8px;
  width: 40px; height: 40px;
  justify-content: center;
}

.comment-composer {
  display: flex; align-items: center; gap: 8px;
  background: rgba(20,20,20,0.82);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 26px;
  padding: 5px 5px 5px 16px;
}
.comment-composer input {
  flex: 1; background: transparent; border: none; outline: none;
  color: #fff; font-size: 0.86rem; font-family: inherit;
  padding: 9px 0;
  min-width: 0;
}
.comment-composer input::placeholder { color: rgba(255,255,255,0.45); }
.comment-composer button {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, #ff2d2d, #c71515);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform var(--transition-fast);
  box-shadow: 0 3px 10px rgba(199,21,21,0.4);
}
.comment-composer button:active { transform: scale(0.9); }
.comment-composer button svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* reactions picker */
.reactions-picker {
  position: absolute;
  bottom: calc(140px + env(safe-area-inset-bottom, 0px));
  left: 12px; right: 12px;
  display: flex;
  justify-content: center;
  z-index: 12;
  opacity: 0;
  transform: translateY(12px) scale(0.9);
  transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.2,0,0,1);
  pointer-events: none;
}
.reactions-picker.open {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
.reactions-picker-inner {
  display: flex;
  gap: 4px;
  padding: 6px;
  background: rgba(18,18,18,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 30px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08);
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}
.reactions-picker-inner::-webkit-scrollbar { display: none; }

.reaction-emoji {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s cubic-bezier(0.2,0,0,1);
  flex-shrink: 0;
}
.reaction-emoji:hover { transform: scale(1.25) translateY(-6px); }
.reaction-emoji:active { transform: scale(0.85); }
.reaction-emoji svg { width: 38px; height: 38px; display: block; }

/* tap-to-show overlay layer (invisible) */
.stream-tap-layer {
  position: absolute; inset: 0;
  z-index: 7;
}

/* ════════ FULLSCREEN MODE ════════ */
.stream-modal:fullscreen .comments-overlay,
.stream-modal:-webkit-full-screen .comments-overlay { display: none !important; }

.stream-modal:fullscreen .stream-bottombar,
.stream-modal:-webkit-full-screen .stream-bottombar { display: none !important; }

.stream-modal:fullscreen .reactions-picker,
.stream-modal:-webkit-full-screen .reactions-picker { display: none !important; }

.stream-modal:fullscreen .stream-topbar,
.stream-modal:-webkit-full-screen .stream-topbar {
  padding-top: 14px;
}

/* ════════ BOTTOM NAV ════════ */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 200;
  background: rgba(8,8,8,0.98);
  backdrop-filter: blur(20px);
  display: flex; justify-content: space-around; align-items: center;
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
  height: calc(60px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -6px 24px rgba(0,0,0,0.5);
}
.bottom-nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 0.6rem; font-weight: 600;
  color: var(--icon-grey);
  transition: color var(--transition);
  padding: 4px 8px; min-width: 60px;
  position: relative; flex: 1;
  letter-spacing: 0.3px; text-transform: uppercase;
}
.bottom-nav a img {
  width: 25px; height: 25px; object-fit: contain;
  filter: brightness(0) saturate(100%) invert(58%) sepia(0%) saturate(0%) brightness(100%) contrast(85%);
  transition: filter var(--transition), transform var(--transition);
}
.bottom-nav a.active img {
  filter: brightness(0) saturate(100%) invert(20%) sepia(90%) saturate(6000%) hue-rotate(352deg) brightness(90%) contrast(95%);
  transform: translateY(-1px);
}
.bottom-nav a.active { color: var(--accent); }
.bottom-nav a:active { transform: scale(0.94); }
.nav-icon-wrapper { position: relative; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; }
.live-badge {
  position: absolute; top: -10px; right: -16px;
  background: linear-gradient(135deg, #ff2d2d 0%, #c71515 100%);
  color: #fff; font-size: 0.5rem; font-weight: 900;
  padding: 3px 6px 3px 5px; border-radius: 20px;
  letter-spacing: 0.6px; line-height: 1;
  text-transform: uppercase; z-index: 5;
  display: flex; align-items: center; gap: 3px;
  box-shadow: 0 2px 8px rgba(199,21,21,0.6);
  animation: livePulse 1.6s ease-in-out infinite;
  pointer-events: none;
}
.live-badge::before {
  content: ''; width: 5px; height: 5px;
  background: #fff; border-radius: 50%;
  animation: pulseDot 1.2s ease-in-out infinite;
}
.live-badge.off { display: none; }
@keyframes livePulse {
  0%, 100% { box-shadow: 0 2px 8px rgba(199,21,21,0.6), 0 0 0 0 rgba(199,21,21,0.6); }
  50% { box-shadow: 0 2px 8px rgba(199,21,21,0.6), 0 0 0 6px rgba(199,21,21,0); }
}

/* ════════ TOAST ════════ */
.toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  z-index: 100000;
  background: rgba(20,20,20,0.96);
  border-radius: 14px;
  padding: 13px 22px;
  display: flex; align-items: center; gap: 10px;
  font-size: 0.9rem; font-weight: 700;
  max-width: 90%;
  box-shadow: 0 12px 32px rgba(0,0,0,0.7), 0 0 0 1px rgba(199,21,21,0.28);
  opacity: 0; pointer-events: none;
  transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2,0,0,1);
  backdrop-filter: blur(14px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast svg { width: 20px; height: 20px; stroke: var(--accent); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.toast.welcome { box-shadow: 0 12px 32px rgba(0,0,0,0.7), 0 0 0 1.5px rgba(255,45,45,0.5), 0 0 32px rgba(255,45,45,0.25); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header class="header" id="mainHeader">
  <div class="container header-row">
    <div class="logo">

<!-- ════════ IMMERSIVE STREAM MODAL ════════ -->
<div class="stream-modal" id="streamModal">
  <div class="stream-stage" id="streamStage">

    <!-- Initial loader -->

    <!-- invisible tap layer -->

    <!-- top bar -->

      </button>
      <div class="stream-meta">

          <span id="modalBroadcaster">—</span>

      <div class="stream-views-badge">

        <span id="modalViews">0</span>

    <!-- comments overlay (Facebook Live) -->
    <div class="comments-overlay" id="modalCommentList"></div>

    <!-- reaction floats -->

    <!-- reactions picker -->
    <div class="reactions-picker" id="reactionsPicker">
      <div class="reactions-picker-inner" id="reactionsPickerInner"></div>
    </div>

    <!-- bottom bar -->
    <div class="stream-bottombar" id="streamBottombar">
      <div class="stream-actions">
        <button class="reaction-btn" id="likeBtn" aria-label="Like">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span id="likeCount">0</span>
        </button>
        <button class="reaction-btn" id="reactionsToggleBtn" aria-label="Reactions">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          <span>React</span>
        </button>
        <button class="reaction-btn" id="commentFocusBtn" aria-label="Comment">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span id="commentCount">0</span>
        </button>
        <button class="reaction-btn icon-only" id="fullscreenBtn" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24" id="fsIcon"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>

      <div class="comment-composer">

      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var header = document.getElementById('mainHeader');
  var lastScrollY = 0, ticking = false, HIDE_AFTER = 100, isHidden = false;
  function updateScroll() {
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    var delta = y - lastScrollY;
    if (header) {
      if (y > 10) header.classList.add('scrolled');
      else header.classList.remove('scrolled');
    }
    if (Math.abs(delta) < 4) { ticking = false; return; }
    if (y < HIDE_AFTER) {
      if (isHidden) { header.classList.remove('hidden'); isHidden = false; }
    } else if (delta > 6 && !isHidden) {
      header.classList.add('hidden'); isHidden = true;
    } else if (delta < -6 && isHidden) {
      header.classList.remove('hidden'); isHidden = false;
    }
    lastScrollY = y < 0 ? 0 : y;
    ticking = false;
  }
  window.addEventListener('scroll', function() {
    if (!ticking) { window.requestAnimationFrame(updateScroll); ticking = true; }
  }, { passive: true });
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
})();
</script>

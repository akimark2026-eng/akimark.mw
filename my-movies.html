<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Movies - Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255,255,255,0.08);
            --radius: 10px;
            --radius-sm: 8px;
            --shadow: 0 8px 24px rgba(0,0,0,0.5);
            --transition: 0.25s ease;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--white); min-height: 100vh; overflow-x: hidden; padding-bottom: 80px; user-select: none; -webkit-user-select: none; }
        body::-webkit-scrollbar { display: none; }
        .header { position: sticky; top: 0; z-index: 100; background: var(--bg-primary); border-bottom: 1px solid var(--border-subtle); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
        .header .back-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; padding: 8px 12px; border-radius: 50px; transition: all 0.2s; }
        .header .back-btn:hover { color: var(--white); background: rgba(255,255,255,0.08); }
        .header .back-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .header .logo img { height: 32px; width: auto; object-fit: contain; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 16px; }
        .page-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .page-title span { color: var(--accent); }

        /* SUMMARY BAR - IZI ZINAYENERA KUKHALAPO */
        .summary-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .summary-bar span:first-child { font-weight: 700; color: #fff; }

        /* Skeleton */
        .skeleton { display: block; }
        .sk-block { background: var(--bg-secondary); border-radius: var(--radius); position: relative; overflow: hidden; }
        .sk-block::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent); animation: shimmer 1.2s infinite; }
        .sk-poster { width: 100%; aspect-ratio: 16/9; border-radius: var(--radius); }
        .sk-title { height: 20px; width: 60%; margin-top: 16px; border-radius: 6px; }
        .sk-meta { height: 12px; width: 40%; margin-top: 10px; border-radius: 6px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .movie-list { display: flex; flex-direction: column; gap: 12px; }
        .movie-item { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 12px; display: flex; gap: 16px; transition: var(--transition); }
        .movie-item:hover { border-color: rgba(199,21,21,0.3); box-shadow: var(--shadow); }
        .movie-item .poster-wrap { width: 140px; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; flex-shrink: 0; position: relative; }
        .movie-item .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .movie-item .info { flex: 1; min-width: 0; }
        .movie-item .title { font-size: 1rem; font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-item .meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
        .movie-item .expiry { font-size: 0.75rem; color: var(--accent); font-weight: 700; background: rgba(199,21,21,0.1); padding: 4px 8px; border-radius: 6px; display: inline-block; margin-bottom: 10px; }
        .movie-item .watch-btn { display: inline-block; background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; text-decoration: none; transition: background 0.2s; }
        .movie-item .watch-btn:hover { background: var(--accent-soft); }
        .movie-item .watch-btn.disabled { background: #444; pointer-events: none; opacity: 0.6; }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
        .empty-state i { font-size: 3rem; color: var(--text-muted); margin-bottom: 12px; }
        .empty-state p { color: var(--text-muted); margin-bottom: 20px; }
        .empty-btn { display: inline-block; background: var(--accent); color: #fff; padding: 10px 24px; border-radius: 50px; font-weight: 700; text-decoration: none; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 12px 20px; display: none; font-size: 0.9rem; z-index: 999; box-shadow: var(--shadow); }
        .toast.show { display: block; }
    </style>
</head>
<body>
    <header class="header">
        <a href="home.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Home
        </a>
        <div class="logo"><img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark"></div>
        <span style="width: 60px;"></span>
    </header>

    <main class="container">
        <h1 class="page-title">My <span>Movies</span></h1>

        <!-- SUMMARY BAR (Yabweretsedwa) -->
        <div class="summary-bar" id="summaryBar">
            <span>0 VIDEOS</span>
            <span>0.0 GB</span>
        </div>

        <!-- Skeleton -->
        <div id="skeleton" class="skeleton">
            <div class="sk-block sk-poster"></div>
            <div class="sk-block sk-title"></div>
            <div class="sk-block sk-meta"></div>
            <div class="sk-block sk-poster" style="margin-top: 16px;"></div>
            <div class="sk-block sk-title"></div>
            <div class="sk-block sk-meta"></div>
        </div>

        <!-- Movie List -->
        <div id="movieList" class="movie-list" style="display: none;"></div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="bi bi-film"></i>
            <p>You haven't watched any movies yet.</p>
            <a href="home.html" class="empty-btn">Browse Movies</a>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript.js/supabase.js"></script>
    <script src="javascript.js/my-movies.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#06060a">
    <title>System Under Maintenance — Akimark</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #06060a;
            --text: #f4f4f7;
            --brand: #c71515;
            --brand-2: #f43f5e;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ══════════ BACKGROUND SCENE ══════════ */
        .scene {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 48px;
            overflow: hidden;
            isolation: isolate;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(199,21,21,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(199,21,21,0.045) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 85%);
            z-index: 0;
            pointer-events: none;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 6s ease-in-out infinite;
        }

        .glow-top {
            top: -15%;
            left: 50%;
            transform: translateX(-50%);
            width: 620px;
            height: 420px;
            background: radial-gradient(circle, rgba(199,21,21,0.55), transparent 65%);
        }

        .glow-bottom {
            bottom: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 350px;
            background: radial-gradient(circle, rgba(244,63,94,0.35), transparent 65%);
            animation-delay: 3s;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
        }

        /* ══════════ FLOATING GEARS ══════════ */
        .floating-gears {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .gear {
            position: absolute;
            fill: rgba(199,21,21,0.32);
            filter: drop-shadow(0 4px 12px rgba(199,21,21,0.35));
            animation: gearSpin linear infinite;
        }

        .gear-1 { top: 12%; left: 8%;  width: 46px; height: 46px; animation-duration: 14s; animation-direction: normal; }
        .gear-2 { top: 22%; right: 10%; width: 34px; height: 34px; animation-duration: 10s; animation-direction: reverse; fill: rgba(251,191,36,0.28); }
        .gear-3 { bottom: 22%; left: 12%; width: 38px; height: 38px; animation-duration: 12s; animation-direction: reverse; }
        .gear-4 { bottom: 15%; right: 8%; width: 52px; height: 52px; animation-duration: 16s; animation-direction: normal; fill: rgba(244,63,94,0.3); }
        .gear-5 { top: 45%; left: 4%; width: 28px; height: 28px; animation-duration: 8s; animation-direction: normal; fill: rgba(199,21,21,0.26); }
        .gear-6 { top: 55%; right: 5%; width: 30px; height: 30px; animation-duration: 11s; animation-direction: reverse; fill: rgba(251,191,36,0.24); }

        @keyframes gearSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ══════════ CONTENT ══════════ */
        .content {
            position: relative;
            z-index: 2;
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 26px;
            text-align: center;
        }

        /* ─── Mascot Stage ─── */
        .mascot-wrap {
            position: relative;
            width: 100%;
            max-width: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: mascotIn 1s cubic-bezier(0.2,0,0,1) both;
        }

        .halo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(199,21,21,0.4), transparent 65%);
            filter: blur(34px);
            z-index: 0;
            animation: haloPulse 4s ease-in-out infinite;
        }

        .halo::after {
            content: '';
            position: absolute;
            inset: 20%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244,63,94,0.42), transparent 70%);
            animation: haloPulse 3s ease-in-out infinite reverse;
        }

        @keyframes haloPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.85; }
            50% { transform: translate(-50%, -50%) scale(1.14); opacity: 1; }
        }

        .mascot {
            position: relative;
            z-index: 1;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 22px 42px rgba(0,0,0,0.65));
            animation: mascotFloat 4s ease-in-out infinite;
        }

        @keyframes mascotFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-9px); }
        }

        @keyframes mascotIn {
            from { opacity: 0; transform: translateY(28px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ─── Title ─── */
        .title {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.7px;
            line-height: 1.15;
            color: #fff;
            animation: fadeUp 0.7s cubic-bezier(0.2,0,0,1) both;
            animation-delay: 0.2s;
        }

        .title .accent {
            background: linear-gradient(135deg, #ff3535, #f43f5e, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 22px rgba(244,63,94,0.55));
        }

        /* ─── Subtitle ─── */
        .subtitle {
            font-size: 0.96rem;
            line-height: 1.72;
            color: #b8b8c8;
            max-width: 400px;
            animation: fadeUp 0.7s cubic-bezier(0.2,0,0,1) both;
            animation-delay: 0.32s;
        }

        .subtitle strong { color: #fff; font-weight: 700; }
        .subtitle .chi { color: #ffb4b4; font-weight: 700; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── Footer ─── */
        .footer {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #4a4a5a;
            margin-top: 6px;
            animation: fadeUp 0.7s cubic-bezier(0.2,0,0,1) both;
            animation-delay: 0.5s;
        }

        .footer strong { color: #7a7a8a; font-weight: 800; letter-spacing: 1.4px; }
        .footer .heart { color: #ff3b3b; display: inline-block; animation: heartBeat 1.4s ease-in-out infinite; }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* ─── Responsive ─── */
        @media (max-width: 420px) {
            .scene { padding: 32px 16px 40px; }
            .title { font-size: 1.7rem; }
            .subtitle { font-size: 0.9rem; }
            .mascot-wrap { max-width: 290px; }
            .halo { width: 280px; height: 280px; }
        }

        @media (max-width: 360px) {
            .title { font-size: 1.48rem; }
            .mascot-wrap { max-width: 250px; }
        }
    </style>
</head>

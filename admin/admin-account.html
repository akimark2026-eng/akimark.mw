<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Account — Akimark Admin</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --bg-base: #0B0F19;
            --bg-surface: #111827;
            --bg-input: #1F2937;
            --bg-input-hover: #374151;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --border-color: #1F2937;
            --border-focus: #374151;
            --accent-primary: #E11D48;
            --accent-hover: #BE123C;
            --accent-glow: rgba(225, 29, 72, 0.2);
            --radius-md: 6px;
            --radius-lg: 10px;
            --sidebar-width: 250px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            font-size: 0.85rem;
        }

        /* Header */
        .admin-header {
            background: #000;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .admin-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hamburger-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .hamburger-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.1);
        }
        .admin-logo img {
            height: 30px;
            width: auto;
            border-radius: 4px;
        }
        .admin-logo-text {
            display: none;
            font-weight: 800;
            font-size: 1rem;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }
        .admin-name {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Sidebar */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1001;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.visible {
            display: block;
            opacity: 1;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: var(--sidebar-width);
            background: #000;
            border-right: 1px solid var(--border-color);
            z-index: 1002;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-header span {
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }
        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            transition: color 0.3s;
        }
        .close-btn:hover {
            color: var(--text-main);
        }
        .sidebar-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-links li {
            margin-bottom: 4px;
        }
        .sidebar-links a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.8rem;
            transition: var(--transition-smooth);
        }
        .sidebar-links a:hover {
            background: var(--bg-input);
            color: var(--text-main);
        }
        .sidebar-links a.active {
            background: rgba(225, 29, 72, 0.1);
            color: var(--accent-primary);
            position: relative;
        }
        .sidebar-links a.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 4px;
            background: var(--accent-primary);
            border-radius: 0 4px 4px 0;
        }

        /* Main Content */
        .main-content {
            max-width: 850px;
            margin: 20px auto;
            padding: 0 16px;
        }
        .account-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
        }
        .account-card h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .account-card h2 i {
            color: var(--accent-primary);
            background: rgba(225, 29, 72, 0.1);
            padding: 6px;
            border-radius: 8px;
            font-size: 1rem;
        }

        /* Coming Soon */
        .coming-soon {
            text-align: center;
            padding: 40px;
            background: var(--bg-input);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border-focus);
            margin-top: 20px;
        }
        .coming-soon i {
            font-size: 3rem;
            color: var(--accent-primary);
            margin-bottom: 16px;
            display: block;
        }
        .coming-soon h1 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .coming-soon p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content { margin: 16px auto; padding: 0 12px; }
            .account-card { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="admin-header">
        <div class="admin-header-left">
            <button class="hamburger-btn" id="hamburgerBtn"><i class="bi bi-list"></i></button>
            <div class="admin-logo">
                <img src="../images/logo-akimark.png" onerror="this.style.display='none'; document.getElementById('logoText').style.display='block';" alt="Akimark">
                <span id="logoText" class="admin-logo-text" style="display:none;">Aki<span style="color:var(--accent-primary)">MARK</span></span>
            </div>
        </div>
        <span id="adminNameBadge" class="admin-name">Hi, Admin</span>
    </header>

    <!-- Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Main Menu</span>
            <button class="close-btn" id="closeSidebar"><i class="bi bi-x-lg"></i></button>
        </div>
        <ul class="sidebar-links">
            <li><a href="admin-dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
            <li><a href="admin-manage.html"><i class="bi bi-cloud-arrow-up-fill"></i> Upload Film</a></li>
            <li><a href="admin-account.html" class="active"><i class="bi bi-gear-fill"></i> Settings</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="account-card">
            <h2><i class="bi bi-gear-fill"></i> Account Settings</h2>
            <div class="coming-soon">
                <i class="bi bi-hourglass-split"></i>
                <h1>Coming Soon</h1>
                <p>Account settings page ikupangidwa. Mukhoza kubwerera mmawa.</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Supabase Config -->
    <script src="../javascript.js/supabase.js"></script>
    
    <!-- Account JS (Coming soon placeholder) -->
    <script src="admin-account.js"></script>

    <!-- UI Scripts (Sidebar toggle) -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            var openBtn = document.getElementById('hamburgerBtn');
            var closeBtn = document.getElementById('closeSidebar');
            function toggleSidebar() {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('visible');
            }
            openBtn.addEventListener('click', toggleSidebar);
            closeBtn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);
        });
    </script>
</body>
</html>

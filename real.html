<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* FULL-SCREEN LOADER */
        .full-loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 40px;
        }
        .full-loader img {
            width: 200px;
            height: auto;
            object-fit: contain;
        }

        /* ════════════════════════════════════════════════════════════
           FADE ARC LOADER (NEW — replaces morphing infinity)
           ════════════════════════════════════════════════════════════ */
        .fade-arc {
            width: 90px;
            height: 90px;
            color: #c71515;
            filter: drop-shadow(0 0 14px rgba(199,21,21,0.55));
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeArcSpin 1s linear infinite;
        }
        .fade-arc svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes fadeArcSpin {
            to { transform: rotate(360deg); }
        }

        .brand-text {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #c71515;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <!-- Full Screen Loader -->
    <div class="full-loader" id="loader">
        <img src="images/loader-logo.jpg" alt="Akimark Logo" onerror="this.style.display='none'; document.getElementById('brandText').style.display='block';">

        <!-- NEW: FadeArc Loader -->
        <div class="fade-arc" role="status" aria-label="Loading">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="fadeArcLeading" x1="50%" x2="50%" y1="5.271%" y2="91.793%">
                        <stop offset="0%" stop-color="currentColor" />
                        <stop offset="100%" stop-color="currentColor" stop-opacity="0.55" />
                    </linearGradient>
                    <linearGradient id="fadeArcTrailing" x1="50%" x2="50%" y1="15.24%" y2="87.15%">
                        <stop offset="0%" stop-color="currentColor" stop-opacity="0" />
                        <stop offset="100%" stop-color="currentColor" stop-opacity="0.55" />
                    </linearGradient>
                </defs>
                <g fill="none">
                    <path
                        d="M8.749.021a1.5 1.5 0 0 1 .497 2.958A7.5 7.5 0 0 0 3 10.375a7.5 7.5 0 0 0 7.5 7.5v3c-5.799 0-10.5-4.7-10.5-10.5C0 5.23 3.726.865 8.749.021"
                        fill="url(#fadeArcLeading)"
                        transform="translate(1.5 1.625)"
                    />
                    <path
                        d="M15.392 2.673a1.5 1.5 0 0 1 2.119-.115A10.48 10.48 0 0 1 21 10.375c0 5.8-4.701 10.5-10.5 10.5v-3a7.5 7.5 0 0 0 5.007-13.084a1.5 1.5 0 0 1-.115-2.118"
                        fill="url(#fadeArcTrailing)"
                        transform="translate(1.5 1.625)"
                    />
                </g>
            </svg>
        </div>

        <div class="brand-text" id="brandText" style="display:none;">Aki<span style="color:#fff;">MARK</span></div>
    </div>

    <script src="javascript.js/index.js"></script>
</body>
</html>

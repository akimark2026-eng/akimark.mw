<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <title>Akimark Home</title>

    <link rel="preconnect" href="https://jnqwvmxuieeelvukhcsq.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://jnqwvmxuieeelvukhcsq.supabase.co">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --icon-grey: #8a8a8a;
            --icon-grey-active: #c71515;
            --border-subtle: rgba(255,255,255,0.08);
            --radius: 8px;
            --radius-sm: 6px;
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
            --transition: 0.25s cubic-bezier(0.2,0,0,1);
            --header-h: 56px;
        }

        html, body {
            overscroll-behavior-y: contain;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar,
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000; color: #fff; min-height: 100vh; overflow-x: hidden;
            padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px));
            user-select: none; -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        a { color: inherit; text-decoration: none; border: none; outline: none; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; outline: none; }
        img { display: block; max-width: 100%; border: none; outline: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 10px; }
        .accent-text { color: var(--accent); }

        /* SKELETON */
        .skeleton-card {
            aspect-ratio: 3/4;
            background: var(--bg-surface);
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
        }
        .skeleton-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #080808;
            border-bottom: 1px solid var(--border-subtle);
            transition: transform 0.35s cubic-bezier(0.2,0,0,1), box-shadow 0.3s ease, background 0.3s ease;
            will-change: transform;
        }
        .header.hidden { transform: translateY(-100%); }
        .header.scrolled {
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            background: rgba(8,8,8,0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .header-row { padding: 10px 0; }
        .header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
        }
        .logo img { height: 36px; width: auto; object-fit: contain; }

        /* 🆕 HEADER ACTIONS — moved inward with extra right padding */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 6px;
        }

        .header-icon-btn {
            position: relative;
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
            -webkit-appearance: none;
            appearance: none;
            color: var(--icon-grey);
        }
        .header-icon-btn:hover { background: #2a2a2a; color: #fff; }
        .header-icon-btn:active { background: rgba(199,21,21,0.3); transform: scale(0.95); }
        .header-icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .notification-badge {
            position: absolute;
            top: -3px; right: -3px;
            background: var(--accent);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
            line-height: 1.2;
        }

        /* MAINTENANCE BANNER */
        .maintenance-banner {
            display: none;
            background: linear-gradient(135deg, #c71515 0%, #7a0d0d 50%, #a00f0f 100%);
            color: #fff;
            border-top: 1px solid rgba(255,255,255,0.18);
            position: relative;
            overflow: hidden;
        }
        .maintenance-banner.visible { display: block; }
        .maintenance-content {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 16px;
        }
        .maintenance-icon {
            flex-shrink: 0;
            width: 34px; height: 34px;
            background: rgba(255,255,255,0.18);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .maintenance-icon svg { width: 20px; height: 20px; fill: #fff; }
        .maintenance-text { flex: 1; display: flex; flex-direction: column; gap: 3px; line-height: 1.35; min-width: 0; }
        .maintenance-text .title { font-size: 0.88rem; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .maintenance-text .title .clock { background: rgba(0,0,0,0.25); color: #fff; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .maintenance-text .body { font-size: 0.8rem; opacity: 0.96; }
        .maintenance-text .body strong { color: #fff; font-weight: 700; }
        .maintenance-close {
            flex-shrink: 0;
            width: 30px; height: 30px;
            border-radius: 50%;
            background: rgba(0,0,0,0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: #fff;
        }
        .maintenance-close svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        @media (max-width: 600px) {
            .maintenance-content { padding: 10px 12px; gap: 10px; }
            .maintenance-icon { width: 30px; height: 30px; }
            .maintenance-icon svg { width: 17px; height: 17px; }
            .maintenance-text .title { font-size: 0.8rem; }
            .maintenance-text .body { font-size: 0.72rem; }
        }

        /* SEARCH */
        .search-subheader { background: #0e0e0e; padding: 0; border-bottom: 1px solid var(--border-subtle); max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; }
        .search-subheader.open { max-height: 400px; overflow: visible; padding: 10px 16px; }
        .search-wrapper { position: relative; max-width: 600px; margin: 0 auto; }
        .search-wrapper input { width: 100%; padding: 10px 14px 10px 42px; border-radius: 8px; border: 1px solid var(--border-subtle); background: var(--bg-secondary); color: #fff; font-size: 0.9rem; outline: none; -webkit-appearance: none; }
        .search-wrapper input:focus { border-color: rgba(199,21,21,0.5); }
        .search-wrapper .search-icon-inline {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px;
            color: var(--icon-grey);
            pointer-events: none;
        }
        .search-wrapper .search-icon-inline svg {
            width: 100%; height: 100%;
            stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .search-results { position: absolute; top: 100%; left: 0; right: 0; background: #151515; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); max-height: 250px; overflow-y: auto; z-index: 1000; display: none; margin-top: 6px; }
        .search-results.visible { display: block; }
        .search-results .result-item { padding: 12px 14px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; font-size: 0.9rem; color: #fff; }
        .search-results .result-item:last-child { border-bottom: none; }
        .search-results .result-item:active { background: rgba(199,21,21,0.3); }

        /* CATEGORIES */
        .subheader { background: #0e0e0e; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); position: sticky; top: var(--header-h); z-index: 99; transition: transform 0.35s cubic-bezier(0.2,0,0,1); }
        .subheader.hidden { transform: translateY(-100%); }
        .subheader .container { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 0 10px; }
        .subheader .container::-webkit-scrollbar { display: none; }
        .category-chip {
            flex-shrink: 0;
            padding: 8px 18px;
            border-radius: 8px;
            background: var(--bg-secondary);
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all var(--transition);
            white-space: nowrap;
            cursor: pointer;
            -webkit-appearance: none;
        }
        .category-chip.active { background: var(--accent); color: #fff; }
        .category-chip:active { background: var(--accent-soft); }

        /* TRANSLATOR BAR */
        .translator-bar { background: #0e0e0e; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); position: sticky; top: calc(var(--header-h) + 48px); z-index: 98; transition: transform 0.35s cubic-bezier(0.2,0,0,1); }
        .translator-bar.hidden { transform: translateY(-100%); }
        .translator-bar .container { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 0 10px; }
        .translator-bar .container::-webkit-scrollbar { display: none; }
        .translator-chip {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 50px;
            background: var(--bg-secondary);
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all var(--transition);
            white-space: nowrap;
            cursor: pointer;
            -webkit-appearance: none;
        }
        .translator-chip.active { background: var(--accent-soft); color: #fff; }
        .translator-chip:active { background: var(--accent); }

        /* MOVIE GRID */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 0; }
        .section-title { font-size: 1rem; font-weight: 700; margin: 8px 0 4px; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
        .section-title img { width: 44px; height: 44px; object-fit: contain; }

        /* MOVIE CARD */
        .movie-card {
            background: #0e0e0e;
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform var(--transition);
            cursor: pointer;
            border: none;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .movie-card:active { transform: scale(0.98); }

        .movie-card .translator-badge {
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: #fff;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 5px 8px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-card .poster {
            aspect-ratio: 3/4;
            position: relative;
            background: #1a1a1a;
            overflow: hidden;
        }

        .movie-card .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            -webkit-user-drag: none;
        }
        .movie-card .poster img.loaded { opacity: 1; }
        .movie-card:active .poster img { transform: scale(1.04); }

        .movie-card .price-tag {
            position: absolute;
            bottom: 8px; right: 8px;
            background: rgba(0,0,0,0.85);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            z-index: 3;
            border: none;
        }
        .movie-card .badge {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 20px;
            z-index: 3;
            text-transform: uppercase;
        }
        .movie-card .info {
            padding: 10px 12px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .movie-card .info h3 {
            font-size: 0.85rem;
            font-weight: 700;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .card-loading { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 10; }
        .card-spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }

        /* EMPTY STATE */
        .more-films-coming {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border-radius: var(--radius);
            color: var(--text-muted);
            text-align: center;
            min-height: 200px;
        }
        .more-films-coming .icon { width: 80px; height: 80px; background: var(--accent); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
        .more-films-coming .icon svg { width: 48px; height: 48px; fill: #fff; }
        .more-films-coming h4 { color: #fff; font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; }
        .more-films-coming p { color: var(--text-muted); font-size: 0.9rem; max-width: 300px; line-height: 1.4; }
        .more-films-coming .underline { width: 40px; height: 4px; background: var(--accent); border-radius: 2px; margin-top: 10px; }

        /* ════════════════════════════════════════════════════════════
           BOTTOM NAV — Inline SVG icons with currentColor
           ════════════════════════════════════════════════════════════ */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 200;
            background: rgba(8,8,8,0.98);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
            height: calc(60px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--border-subtle);
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--icon-grey);
            transition: color var(--transition);
            padding: 4px 8px;
            min-width: 60px;
            position: relative;
            flex: 1;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            border: none;
            outline: none;
        }
        .bottom-nav a.active { color: var(--icon-grey-active); }
        .bottom-nav a:active { transform: scale(0.94); }

        /* 🆕 Inline SVG for bottom nav */
        .bottom-nav a .nav-svg {
            width: 25px;
            height: 25px;
            display: block;
            color: inherit;
        }
        .bottom-nav a .nav-svg svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-icon-wrapper { position: relative; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; }

        .nav-badge {
            position: absolute;
            top: -6px; right: -8px;
            background: #c71515;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 50%;
            min-width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            z-index: 2;
            border: none;
        }

        /* LIVE BADGE */
        .live-badge {
            position: absolute;
            top: -8px; right: -14px;
            background: #c71515;
            color: #fff;
            font-size: 0.5rem;
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            line-height: 1;
            text-transform: uppercase;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 3px;
            animation: livePulse 1.6s ease-in-out infinite;
            border: none;
        }
        .live-badge::before {
            content: '';
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            animation: liveDot 1.2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(199,21,21,0.7); }
            50% { box-shadow: 0 0 0 5px rgba(199,21,21,0); }
        }
        @keyframes liveDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* TOAST & WATERMARK */
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 500; background: var(--bg-surface); border-radius: var(--radius-sm); padding: 12px 20px; display: none; align-items: center; gap: 10px; font-size: 0.9rem; max-width: 90%; }
        .toast.visible { display: flex; }
        .watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 3rem; color: rgba(255,255,255,0.1); pointer-events: none; z-index: 9999; text-transform: uppercase; white-space: nowrap; user-select: none; display: none; }
        .watermark.active { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="watermark" id="watermark">AKIMARK</div>

    <!-- HEADER -->
    <header class="header" id="mainHeader">
        <div class="container header-row">
            <div class="logo">
                <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark">
            </div>
            <div class="header-actions">
                <button class="header-icon-btn" id="searchNavBtn" aria-label="Search">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
                <a href="notifications.html" class="header-icon-btn" aria-label="Notifications">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="notification-badge" id="notificationBadge">0</span>
                </a>
            </div>
        </div>

        <div class="maintenance-banner" id="maintenanceBanner" role="alert" aria-live="polite">
            <div class="maintenance-content">
                <div class="maintenance-icon">
                    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                </div>
                <div class="maintenance-text">
                    <div class="title">
                        System Maintenance Notice
                        <span class="clock" id="malawiClock">--:--</span>
                    </div>
                    <div class="body">
                        We'll be performing system upgrades starting at <strong>1:00 PM</strong>. Service may be temporarily unavailable.
                    </div>
                </div>
                <button class="maintenance-close" id="maintenanceClose" aria-label="Close notice">
                    <svg viewBox="0 0 24 24">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- SEARCH -->
    <div class="search-subheader" id="searchSubheader">
        <div class="search-wrapper">
            <span class="search-icon-inline">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </span>
            <input type="text" placeholder="Search movies, series, translators..." id="searchInput">
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <!-- CATEGORIES -->
    <div class="subheader" id="subheader">
        <div class="container">
            <button class="category-chip active" data-category="all">All</button>
            <button class="category-chip" data-category="series">Series</button>
            <button class="category-chip" data-category="indian">Indian</button>
            <button class="category-chip" data-category="actions">Actions</button>
            <button class="category-chip" data-category="nigeria">Nigeria</button>
            <button class="category-chip" data-category="china">China</button>
            <button class="category-chip" data-category="turkish">Turkish</button>
            <button class="category-chip" data-category="korean">Korea</button>
            <button class="category-chip" data-category="philippines">Philippines</button>
            <button class="category-chip" data-category="cartoons">Cartoons</button>
        </div>
    </div>

    <!-- TRANSLATOR BAR -->
    <div class="translator-bar" id="translatorBar">
        <div class="container" id="translatorContainer"></div>
    </div>

    <!-- MAIN -->
    <main class="container">

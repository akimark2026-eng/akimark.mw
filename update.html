<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>Update Required — Akimark</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #0a0a0f;
            --bg-2: #12121a;
            --card: #16161f;
            --border: rgba(255,255,255,0.08);
            --text: #f4f4f7;
            --muted: #9a9aae;
            --brand: #c71515;
            --brand-2: #f43f5e;
            --brand-glow: rgba(199,21,21,0.4);
            --gold: #fbbf24;
            --success: #10b981;
        }

        html, body {
            background: #000;
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(900px 600px at 50% 0%, rgba(199,21,21,0.20), transparent 60%),
                radial-gradient(700px 500px at 50% 100%, rgba(199,21,21,0.10), transparent 60%);
            pointer-events: none;
            animation: bgPulse 5s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Main container */
        .update-wrap {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px 40px;
            text-align: center;
        }

        .card {
            max-width: 460px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        /* Logo */
        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: logoFloat 3s ease-in-out infinite;
        }

        .logo-wrap img {
            width: 200px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 8px 28px rgba(199,21,21,0.5));
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Icon */
        .icon-wrap {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(199,21,21,0.28), rgba(122,13,13,0.38));
            border: 1.5px solid rgba(199,21,21,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 0 rgba(199,21,21,0.5);
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(199,21,21,0.5); }
            50% { box-shadow: 0 0 0 18px rgba(199,21,21,0); }
        }

        .icon-wrap svg {
            width: 46px;
            height: 46px;
            fill: #c71515;
        }

        /* Title */
        .title {
            font-size: 1.65rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.2;
            color: #ffffff;
        }

        .title .accent {
            color: var(--brand);
        }

        /* Subtitle */
        .subtitle {
            font-size: 0.95rem;
            line-height: 1.65;
            color: #b8b8c8;
            max-width: 380px;
        }

        .subtitle strong {
            color: #fff;
            font-weight: 700;
        }

        /* Version comparison */
        .versions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 12px 18px;
            background: rgba(20,20,26,0.7);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
        }

        .version-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .version-chip .label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #6a6a7a;
        }

        .version-chip .value {
            font-size: 0.9rem;
            font-weight: 800;
            font-family: 'SF Mono', Menlo, monospace;
        }

        .version-chip.current .value {
            color: #ff6b6b;
        }

        .version-chip.latest .value {
            color: var(--success);
        }

        .arrow {
            color: var(--brand);
            font-size: 1.2rem;
            font-weight: 800;
        }

        /* Primary button */
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 340px;
            padding: 16px 28px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 12px 32px var(--brand-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: btnShine 2.8s ease-in-out infinite;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px var(--brand-glow);
        }

        .btn-download:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-download svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        @keyframes btnShine {
            0%, 100% { box-shadow: 0 12px 32px var(--brand-glow); }
            50% { box-shadow: 0 12px 32px var(--brand-glow), 0 0 0 8px rgba(199,21,21,0.08); }
        }

        /* Secondary button */
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            color: #b8b8c8;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-retry:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }

        .btn-retry svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* Footer */
        .footer {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #4a4a5a;
            margin-top: 8px;
        }

        .footer strong {
            color: #6a6a7a;
            font-weight: 800;
        }

        /* Status pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(199,21,21,0.10);
            border: 1px solid rgba(199,21,21,0.3);
            color: var(--brand);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .status-pill .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--brand);
            box-shadow: 0 0 0 0 rgba(199,21,21,0.7);
            animation: dotPulse 1.6s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(199,21,21,0.7); }
            50% { box-shadow: 0 0 0 8px rgba(199,21,21,0); }
        }

        /* Loading indicator (initial) */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .loading-spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(199,21,21,0.2);
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .title { font-size: 1.4rem; }
            .subtitle { font-size: 0.88rem; }
            .logo-wrap img { width: 170px; }
            .icon-wrap { width: 82px; height: 82px; }
            .icon-wrap svg { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <div class="update-wrap">
        <div class="card" id="content">
            <!-- Initial loading state (replaced by JS) -->
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <div class="loading-text">Checking for updates…</div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ════════════════════════════════════════════════════════════
        // CONFIG
        // ════════════════════════════════════════════════════════════
        const DOWNLOAD_URL = 'https://akimark.mw';
        const FALLBACK_LATEST = '3.0.1.1';

        // ════════════════════════════════════════════════════════════
        // READ URL PARAMETERS
        // ════════════════════════════════════════════════════════════
        const params = new URLSearchParams(window.location.search);
        const latestVersion = params.get('latest') || FALLBACK_LATEST;
        const currentVersion = params.get('current') || 'unknown';

        // ════════════════════════════════════════════════════════════
        // SAFE HTML ESCAPE
        // ════════════════════════════════════════════════════════════
        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ════════════════════════════════════════════════════════════
        // RENDER UPDATE SCREEN
        // ════════════════════════════════════════════════════════════
        function render() {
            const content = document.getElementById('content');

            const currentLabel = currentVersion && currentVersion !== 'unknown'
                ? currentVersion
                : 'unknown';

            content.innerHTML = `
                <div class="logo-wrap">
                    <img src="images/loader-logo.jpg"
                         alt="Akimark"
                         onerror="this.style.display='none';">
                </div>

                <div class="icon-wrap">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 5v6.59l2.3-2.29 1.4 1.42L12 17.41l-4.7-4.7 1.4-1.42L11 13.59V7h2zm-1 13a8 8 0 110-16 8 8 0 010 16z" fill="none"/>
                        <path d="M11 7h2v6.59l2.3-2.29 1.4 1.42L12 17.41l-4.7-4.7 1.4-1.42L11 13.59V7z"/>
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                    </svg>
                </div>

                <div class="status-pill">
                    <span class="dot"></span>
                    <span>Update Required</span>
                </div>

                <h1 class="title">
                    New <span class="accent">Version</span> Available
                </h1>

                <p class="subtitle">
                    Tawonjezela machitidwe a <strong>App yathu</strong>.
                    Chonde pangani download app yatsopano pa
                    <strong>akimark.mw</strong> kuti mupedze version yatsopano
                    ndikupitiliza kugwiritsa ntchito Akimark.
                </p>

                <div class="versions">
                    <div class="version-chip current">
                        <span class="label">Your Version</span>
                        <span class="value">${esc(currentLabel)}</span>
                    </div>
                    <span class="arrow">→</span>
                    <div class="version-chip latest">
                        <span class="label">Latest Version</span>
                        <span class="value">${esc(latestVersion)}</span>
                    </div>
                </div>

                <a class="btn-download" href="${esc(DOWNLOAD_URL)}">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
                    </svg>
                    DOWNLOAD NOW
                </a>

                <button class="btn-retry" id="retryBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M17.65 6.35A7.958 7.958 0 0012 4a8 8 0 100 16c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18a6 6 0 110-12c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    Recheck Version
                </button>

                <div class="footer">
                    Made with <strong>♥</strong> for Malawi — <strong>Akimark</strong>
                </div>
            `;

            // Recheck button — reload the page to re-verify
            const retryBtn = document.getElementById('retryBtn');
            if (retryBtn) {
                retryBtn.addEventListener('click', function() {
                    window.location.href = 'index.html';
                });
            }
        }

        // ════════════════════════════════════════════════════════════
        // BOOT
        // ════════════════════════════════════════════════════════════
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', render);
        } else {
            render();
        }
    })();
    </script>
</body>
</html>

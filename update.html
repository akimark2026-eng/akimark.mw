<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>Update Available — Akimark</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #0a0a0f;
            --bg-2: #12121a;
            --card: #16161f;
            --border: rgba(255,255,255,0.08);
            --text: #f4f4f7;
            --muted: #9a9aae;
            --brand: #c71515;
            --brand-2: #f43f5e;
            --brand-glow: rgba(199,21,21,0.4);
            --gold: #fbbf24;
            --success: #10b981;
        }

        html, body {
            background: #000;
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(900px 600px at 50% 0%, rgba(199,21,21,0.20), transparent 60%),
                radial-gradient(700px 500px at 50% 100%, rgba(199,21,21,0.10), transparent 60%);
            pointer-events: none;
            animation: bgPulse 5s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .update-wrap {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px 40px;
            text-align: center;
        }

        .card {
            max-width: 460px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        /* RED BANNER */
        .red-banner {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, #c71515 0%, #7a0d0d 50%, #a00f0f 100%);
            color: #fff;
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(199,21,21,0.35);
            animation: bannerSlide 0.5s cubic-bezier(0.2,0,0,1);
        }

        .red-banner::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            animation: bannerShimmer 3s infinite;
        }

        .red-banner .icon {
            flex-shrink: 0;
            width: 30px; height: 30px;
            background: rgba(255,255,255,0.18);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.25);
            position: relative; z-index: 1;
        }

        .red-banner .icon svg { width: 18px; height: 18px; fill: #fff; }

        .red-banner .text {
            flex: 1; text-align: left;
            font-size: 0.85rem; font-weight: 700;
            letter-spacing: 0.3px; line-height: 1.4;
            position: relative; z-index: 1;
        }

        .red-banner .text .sub {
            font-weight: 500; font-size: 0.75rem;
            opacity: 0.9; margin-top: 2px; letter-spacing: 0.2px;
        }

        @keyframes bannerSlide {
            from { transform: translateY(-14px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes bannerShimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .title {
            font-size: 1.65rem; font-weight: 900;
            letter-spacing: -0.5px; line-height: 1.2; color: #ffffff;
        }

        .title .accent { color: var(--brand); }

        .subtitle {
            font-size: 0.95rem; line-height: 1.65;
            color: #b8b8c8; max-width: 380px;
        }

        .subtitle strong { color: #fff; font-weight: 700; }

        .download-section {
            width: 100%; max-width: 340px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .btn-download {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 10px; width: 100%; padding: 16px 28px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: #fff; font-size: 1rem; font-weight: 800;
            letter-spacing: 0.3px; text-decoration: none;
            border: none; cursor: pointer;
            box-shadow: 0 12px 32px var(--brand-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s;
            animation: btnShine 2.8s ease-in-out infinite;
            font-family: inherit;
        }

        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px var(--brand-glow);
        }

        .btn-download:active:not(:disabled) { transform: translateY(0) scale(0.98); }
        .btn-download:disabled { cursor: not-allowed; opacity: 0.7; }
        .btn-download svg { width: 20px; height: 20px; fill: #fff; }

        @keyframes btnShine {
            0%, 100% { box-shadow: 0 12px 32px var(--brand-glow); }
            50% { box-shadow: 0 12px 32px var(--brand-glow), 0 0 0 8px rgba(199,21,21,0.08); }
        }

        /* INSTALL BUTTON (NEW) */
        .btn-install {
            display: none;
            align-items: center; justify-content: center;
            gap: 10px; width: 100%; padding: 16px 28px;
            border-radius: 14px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff; font-size: 1rem; font-weight: 800;
            letter-spacing: 0.3px; text-decoration: none;
            border: none; cursor: pointer;
            box-shadow: 0 12px 32px rgba(16,185,129,0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: inherit;
            animation: installPop 0.5s cubic-bezier(0.2,0.7,0.2,1);
        }

        .btn-install.show { display: inline-flex; }
        .btn-install:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(16,185,129,0.5); }
        .btn-install:active { transform: translateY(0) scale(0.98); }
        .btn-install svg { width: 22px; height: 22px; fill: #fff; }

        @keyframes installPop {
            0% { opacity: 0; transform: scale(0.9); }
            60% { opacity: 1; transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* PROGRESS BAR */
        .progress-block {
            display: none; flex-direction: column; gap: 8px;
            padding: 14px 16px;
            background: rgba(20,20,26,0.75);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            animation: fadeUp 0.35s ease;
        }

        .progress-block.show { display: flex; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px;
        }

        .progress-label {
            font-size: 0.78rem; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase;
            color: #b8b8c8;
            display: flex; align-items: center; gap: 6px;
        }

        .progress-label .live-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--brand);
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(199,21,21,0.7); }
            50% { box-shadow: 0 0 0 6px rgba(199,21,21,0); }
        }

        .progress-percent {
            font-size: 0.95rem; font-weight: 900;
            color: var(--brand);
            font-family: 'SF Mono', Menlo, monospace;
            letter-spacing: 0.5px;
        }

        .progress-percent.done { color: var(--success); }

        .progress-track {
            width: 100%; height: 8px; border-radius: 999px;
            background: rgba(255,255,255,0.06);
            overflow: hidden; position: relative;
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--brand), var(--brand-2));
            border-radius: 999px;
            transition: width 0.15s linear;
            position: relative; overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            animation: fillShimmer 1.4s infinite;
        }

        .progress-fill.done { background: linear-gradient(90deg, var(--success), #34d399); }

        @keyframes fillShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-status {
            font-size: 0.72rem; color: var(--muted);
            font-weight: 600; letter-spacing: 0.2px; text-align: left;
        }

        .btn-retry {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; padding: 10px 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            color: #b8b8c8; font-size: 0.82rem; font-weight: 600;
            border-radius: 10px; cursor: pointer;
            transition: all 0.2s ease; font-family: inherit;
        }

        .btn-retry:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .btn-retry svg { width: 14px; height: 14px; fill: currentColor; }

        .footer {
            font-size: 0.72rem; font-weight: 600;
            letter-spacing: 0.5px; text-transform: uppercase;
            color: #4a4a5a; margin-top: 8px;
        }

        .footer strong { color: #6a6a7a; font-weight: 800; }

        .loading-state {
            display: flex; flex-direction: column;
            align-items: center; gap: 18px;
        }

        .loading-spinner {
            width: 42px; height: 42px;
            border: 3px solid rgba(199,21,21,0.2);
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 0.85rem; color: var(--muted); font-weight: 600;
        }

        @media (max-width: 480px) {
            .title { font-size: 1.4rem; }
            .subtitle { font-size: 0.88rem; }
            .red-banner { padding: 12px 14px; }
            .red-banner .text { font-size: 0.8rem; }
            .red-banner .text .sub { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="update-wrap">
        <div class="card" id="content">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <div class="loading-text">Checking for updates…</div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ════════════════════════════════════════════════════════════
        // CONFIG
        // ════════════════════════════════════════════════════════════
        const DOWNLOAD_URL = '1akimark.apk';
        const DOWNLOAD_FILENAME = '1akimark.apk';

        // Is running inside Android WebView?
        const IS_ANDROID = !!(window.Android && window.Android.isAndroid && window.Android.isAndroid());

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ════════════════════════════════════════════════════════════
        // RENDER
        // ════════════════════════════════════════════════════════════
        function render() {
            const content = document.getElementById('content');

            content.innerHTML = `
                <div class="red-banner">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                    </div>
                    <div class="text">
                        New version available
                        <div class="sub">Please update to continue using Akimark</div>
                    </div>
                </div>

                <h1 class="title">
                    Update <span class="accent">App</span>
                </h1>

                <p class="subtitle">
                    Tawonjezela machitidwe a <strong>App yathu</strong>.
                    Chonde pangani download app yatsopano kuti mupitilize
                    kugwiritsa ntchito <strong>Akimark</strong>.
                </p>

                <div class="download-section">
                    <button class="btn-download" id="downloadBtn">
                        <svg viewBox="0 0 24 24">
                            <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
                        </svg>
                        DOWNLOAD NOW
                    </button>

                    <button class="btn-install" id="installBtn">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                        INSTALL NOW
                    </button>

                    <div class="progress-block" id="progressBlock">
                        <div class="progress-header">
                            <div class="progress-label">
                                <span class="live-dot"></span>
                                <span id="progressLabel">Downloading…</span>
                            </div>
                            <div class="progress-percent" id="progressPercent">0%</div>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-status" id="progressStatus">Starting download…</div>
                    </div>
                </div>

                <button class="btn-retry" id="retryBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M17.65 6.35A7.958 7.958 0 0012 4a8 8 0 100 16c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18a6 6 0 110-12c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    Recheck Version
                </button>

                <div class="footer">
                    Made with <strong>♥</strong> for Malawi — <strong>Akimark</strong>
                </div>
            `;

            var downloadBtn = document.getElementById('downloadBtn');
            var installBtn = document.getElementById('installBtn');
            var progressBlock = document.getElementById('progressBlock');
            var progressFill = document.getElementById('progressFill');
            var progressPercent = document.getElementById('progressPercent');
            var progressLabel = document.getElementById('progressLabel');
            var progressStatus = document.getElementById('progressStatus');
            var retryBtn = document.getElementById('retryBtn');

            var isDownloading = false;

            if (retryBtn) {
                retryBtn.addEventListener('click', function() {
                    window.location.href = 'index.html';
                });
            }

            // ════════════════════════════════════════════════════════
            // ANDROID WEBVIEW MODE — native download + install
            // ════════════════════════════════════════════════════════
            if (IS_ANDROID) {
                // Check if APK already downloaded
                try {
                    if (window.Android.isApkDownloaded && window.Android.isApkDownloaded()) {
                        installBtn.classList.add('show');
                    }
                } catch (e) {}

                downloadBtn.addEventListener('click', function() {
                    if (isDownloading) return;
                    isDownloading = true;
                    downloadBtn.disabled = true;
                    downloadBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 5v6.59l2.3-2.29 1.4 1.42L12 17.41l-4.7-4.7 1.4-1.42L11 13.59V7h2z"/></svg> Downloading…';

                    progressBlock.classList.add('show');
                    progressFill.style.width = '0%';
                    progressFill.classList.remove('done');
                    progressPercent.textContent = '0%';
                    progressPercent.classList.remove('done');
                    progressLabel.textContent = 'Downloading…';
                    progressStatus.textContent = 'Starting…';

                    try {
                        window.Android.downloadAndInstallApk(DOWNLOAD_URL);
                    } catch (err) {
                        console.error('[Installer] Failed to call native:', err);
                        progressStatus.textContent = 'Error: ' + err.message;
                        isDownloading = false;
                        downloadBtn.disabled = false;
                        downloadBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg> DOWNLOAD NOW';
                    }
                });

                installBtn.addEventListener('click', function() {
                    try {
                        if (window.Android.installDownloadedApk) {
                            window.Android.installDownloadedApk();
                        }
                    } catch (e) {
                        console.error('[Installer] Install failed:', e);
                    }
                });

                // Native → JS callbacks
                window.onAkimarkInstallerEvent = function(type, payloadJson) {
                    var payload = {};
                    try { payload = JSON.parse(payloadJson || '{}'); } catch (e) {}

                    console.log('[Installer Event]', type, payload);

                    if (type === 'download_started') {
                        progressLabel.textContent = 'Downloading…';
                        progressStatus.textContent = 'Download in background (check notification)';
                        progressFill.style.width = '30%';
                        progressPercent.textContent = '30%';
                    } else if (type === 'download_complete') {
                        progressFill.style.width = '100%';
                        progressFill.classList.add('done');
                        progressPercent.textContent = '100%';
                        progressPercent.classList.add('done');
                        progressLabel.textContent = 'Download Complete';
                        progressStatus.textContent = 'Tap "Install Now" to install';
                        installBtn.classList.add('show');
                        downloadBtn.disabled = false;
                        downloadBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Downloaded';
                        isDownloading = false;
                    } else if (type === 'install_started') {
                        progressLabel.textContent = 'Installing…';
                        progressStatus.textContent = 'Follow the installer prompts';
                    } else if (type === 'install_permission_needed') {
                        progressLabel.textContent = 'Permission needed';
                        progressStatus.textContent = 'Allow install from this source, then return';
                    } else if (type === 'download_failed') {
                        progressLabel.textContent = 'Download Failed';
                        progressStatus.textContent = 'Please try again';
                        downloadBtn.disabled = false;
                        downloadBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg> Try Again';
                        isDownloading = false;
                    } else if (type === 'error') {
                        progressStatus.textContent = 'Error: ' + (payload.message || 'unknown');
                        downloadBtn.disabled = false;
                        downloadBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg> Try Again';
                        isDownloading = false;
                    }
                };
            } else {
                // ════════════════════════════════════════════════════════
                // BROWSER MODE — standard download with progress
                // ════════════════════════════════════════════════════════
                downloadBtn.addEventListener('click', function() {
                    if (isDownloading) return;
                    isDownloading = true;
                    downloadBtn.disabled = true;
                    downloadBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 5v6.59l2.3-2.29 1.4 1.42L12 17.41l-4.7-4.7 1.4-1.42L11 13.59V7h2z"/></svg> Downloading…';

                    progressBlock.classList.add('show');
                    progressFill.style.width = '0%';
                    progressFill.classList.remove('done');
                    progressPercent.textContent = '0%';
                    progressPercent.classList.remove('done');
                    progressLabel.textContent = 'Downloading…';
                    progressStatus.textContent = 'Starting download…';

                    startBrowserDownload();
                });

                function startBrowserDownload() {
                    if (window.fetch && window.ReadableStream && window.Response) {
                        fetch(DOWNLOAD_URL, { method: 'GET', cache: 'no-store' })
                        .then(function(response) {
                            if (!response.ok) throw new Error('HTTP ' + response.status);

                            var contentLength = response.headers.get('content-length');
                            var reader = response.body && response.body.getReader ? response.body.getReader() : null;
                            if (!reader) { triggerBrowserDownload(); return; }

                            var received = 0;
                            var total = contentLength ? parseInt(contentLength, 10) : 0;
                            var chunks = [];

                            function pump() {
                                return reader.read().then(function(result) {
                                    if (result.done) {
                                        var blob = new Blob(chunks, { type: 'application/vnd.android.package-archive' });
                                        saveBlob(blob);
                                        onDownloadComplete();
                                        return;
                                    }
                                    chunks.push(result.value);
                                    received += result.value.length;
                                    if (total > 0) {
                                        var pct = Math.min(100, Math.round((received / total) * 100));
                                        onProgress(pct, received, total);
                                    } else {
                                        var approxPct = Math.min(95, Math.round((received / (5 * 1024 * 1024)) * 100));
                                        onProgress(approxPct, received, 0);
                                    }
                                    return pump();
                                });
                            }
                            return pump();
                        })
                        .catch(function(err) {
                            console.warn('[Akimark] Stream download failed, fallback:', err);
                            triggerBrowserDownload();
                        });
                    } else {
                        triggerBrowserDownload();
                    }
                }

                function onProgress(pct, received, total) {
                    progressFill.style.width = pct + '%';
                    progressPercent.textContent = pct + '%';
                    if (total > 0) {
                        var r = (received / (1024 * 1024)).toFixed(1);
                        var t = (total / (1024 * 1024)).toFixed(1);
                        progressStatus.textContent = r + ' MB / ' + t + ' MB';
                    } else {
                        var r2 = (received / (1024 * 1024)).toFixed(1);
                        progressStatus.textContent = r2 + ' MB downloaded';
                    }
                }

                function onDownloadComplete() {
                    progressFill.style.width = '100%';
                    progressFill.classList.add('done');
                    progressPercent.textContent = '100%';
                    progressPercent.classList.add('done');
                    progressLabel.textContent = 'Download Complete';
                    progressStatus.textContent = 'Please install the APK file';
                    downloadBtn.disabled = false;
                    downloadBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Download Again';
                    isDownloading = false;
                }

                function saveBlob(blob) {
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = DOWNLOAD_FILENAME;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(function() {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 200);
                }

                function triggerBrowserDownload() {
                    var a = document.createElement('a');
                    a.href = DOWNLOAD_URL;
                    a.download = DOWNLOAD_FILENAME;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(function() { document.body.removeChild(a); }, 200);

                    var pct = 0;
                    var interval = setInterval(function() {
                        pct += Math.floor(Math.random() * 8) + 4;
                        if (pct >= 100) {
                            pct = 100;
                            clearInterval(interval);
                            onProgress(pct, 0, 0);
                            onDownloadComplete();
                        } else {
                            onProgress(pct, 0, 0);
                        }
                    }, 400);
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', render);
        } else {
            render();
        }
    })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* FULL-SCREEN LOADER */
        .full-loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 44px;
            padding: 30px;
        }

        .loader-logo {
            width: 200px;
            height: auto;
            object-fit: contain;
            animation: logoFadeIn 0.8s cubic-bezier(0.2, 0, 0, 1);
        }

        @keyframes logoFadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ════════════════════════════════════════════════════════════
           🎬 CINEMA FILM REEL LOADER — pure HTML/CSS
           • Rotating film reel (SVG)
           • Pulsing red glow ring
           • Film perforations spinning around
           • Very cinematic, very professional
           ════════════════════════════════════════════════════════════ */
        .film-loader-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Outer pulsing glow rings */
        .film-loader-wrap::before,
        .film-loader-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(199, 21, 21, 0.6);
            animation: glowPulse 2.4s ease-out infinite;
            pointer-events: none;
        }
        .film-loader-wrap::after { animation-delay: 1.2s; }

        @keyframes glowPulse {
            0%   { transform: scale(0.6); opacity: 0.9; border-width: 3px; }
            100% { transform: scale(1.6); opacity: 0; border-width: 1px; }
        }

        /* Rotating film reel */
        .film-reel {
            width: 90px;
            height: 90px;
            position: relative;
            z-index: 2;
            animation: reelSpin 2.8s linear infinite;
            filter: drop-shadow(0 0 14px rgba(199, 21, 21, 0.55));
        }

        .film-reel svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .film-reel svg .reel-ring {
            stroke: #c71515;
            stroke-width: 2.5;
            fill: none;
        }

        .film-reel svg .reel-hole {
            fill: #c71515;
        }

        .film-reel svg .reel-hub {
            fill: #000;
            stroke: #c71515;
            stroke-width: 2.5;
        }

        .film-reel svg .reel-hub-inner {
            fill: #c71515;
            opacity: 0.85;
        }

        @keyframes reelSpin {
            to { transform: rotate(360deg); }
        }

        /* Film perforations spinning opposite direction */
        .film-perfs {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            z-index: 1;
            animation: perfSpin 6s linear infinite;
            pointer-events: none;
        }

        .film-perfs span {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 8px;
            background: linear-gradient(180deg, #c71515, rgba(199, 21, 21, 0.3));
            border-radius: 1px;
            transform-origin: 0 0;
            opacity: 0.75;
        }
        .film-perfs span:nth-child(1)  { transform: translate(-2px, -70px) rotate(0deg); }
        .film-perfs span:nth-child(2)  { transform: translate(-2px, -70px) rotate(30deg); }
        .film-perfs span:nth-child(3)  { transform: translate(-2px, -70px) rotate(60deg); }
        .film-perfs span:nth-child(4)  { transform: translate(-2px, -70px) rotate(90deg); }
        .film-perfs span:nth-child(5)  { transform: translate(-2px, -70px) rotate(120deg); }
        .film-perfs span:nth-child(6)  { transform: translate(-2px, -70px) rotate(150deg); }
        .film-perfs span:nth-child(7)  { transform: translate(-2px, -70px) rotate(180deg); }
        .film-perfs span:nth-child(8)  { transform: translate(-2px, -70px) rotate(210deg); }
        .film-perfs span:nth-child(9)  { transform: translate(-2px, -70px) rotate(240deg); }
        .film-perfs span:nth-child(10) { transform: translate(-2px, -70px) rotate(270deg); }
        .film-perfs span:nth-child(11) { transform: translate(-2px, -70px) rotate(300deg); }
        .film-perfs span:nth-child(12) { transform: translate(-2px, -70px) rotate(330deg); }

        @keyframes perfSpin {
            to { transform: rotate(-360deg); }
        }

        /* Brand text */
        .brand-text {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #c71515;
            text-shadow: 0 0 18px rgba(199, 21, 21, 0.6), 2px 2px 4px rgba(0,0,0,0.8);
            animation: brandPulse 2s ease-in-out infinite;
        }

        .brand-text .white {
            color: #fff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.35), 2px 2px 4px rgba(0,0,0,0.8);
        }

        @keyframes brandPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }

        /* Loading subtitle */
        .loading-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-top: -20px;
        }

        .loading-label .dot {
            width: 4px;
            height: 4px;
            background: #c71515;
            border-radius: 50%;
            animation: dotBlink 1.4s ease-in-out infinite;
        }
        .loading-label .dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-label .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBlink {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50%      { opacity: 1;   transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <!-- Full Screen Loader -->
    <div class="full-loader" id="loader">

        <img
            src="images/loader-logo.jpg"
            alt="Akimark"
            class="loader-logo"
            onerror="this.style.display='none';">

        <!-- 🎬 Cinema Film Reel Loader -->
        <div class="film-loader-wrap">

            <!-- Film perforations spinning around the reel -->
            <div class="film-perfs" aria-hidden="true">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </div>

            <!-- Film reel spinning -->
            <div class="film-reel" role="status" aria-label="Loading">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Outer reel ring -->
                    <circle class="reel-ring" cx="50" cy="50" r="42"/>

                    <!-- Center hub -->
                    <circle class="reel-hub" cx="50" cy="50" r="13"/>
                    <circle class="reel-hub-inner" cx="50" cy="50" r="5"/>

                    <!-- Six reel holes arranged in a circle -->
                    <circle class="reel-hole" cx="50" cy="17" r="6"/>
                    <circle class="reel-hole" cx="78.6" cy="33.5" r="6"/>
                    <circle class="reel-hole" cx="78.6" cy="66.5" r="6"/>
                    <circle class="reel-hole" cx="50" cy="83" r="6"/>
                    <circle class="reel-hole" cx="21.4" cy="66.5" r="6"/>
                    <circle class="reel-hole" cx="21.4" cy="33.5" r="6"/>
                </svg>
            </div>
        </div>

        <!-- Brand text -->
        <div class="brand-text">
            AKI<span class="white">MARK</span>
        </div>

        <!-- Loading label with animated dots -->
        <div class="loading-label">
            Loading
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <script src="javascript.js/index.js?v=20260925-2"></script>
</body>
</html>

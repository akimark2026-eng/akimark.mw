<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0f" />
<title>Akimark — Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

<!-- hls.js for HLS + AES-128 playback -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

<style>
:root {
  --bg: #0a0a0f; --bg-2: #12121a; --card: #16161f; --card-2: #1d1d28;
  --border: rgba(255,255,255,0.08); --border-hover: rgba(255,255,255,0.18);
  --text: #f4f4f7; --muted: #9a9aae; --muted-2: #6b6b80;
  --brand: #E11D48; --brand-2: #f43f5e; --brand-glow: rgba(225,29,72,0.35);
  --gold: #fbbf24; --success: #10b981;
  --radius: 16px; --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; min-height: 100%; overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(900px 500px at 20% -10%, rgba(225,29,72,0.14), transparent 60%),
    radial-gradient(700px 400px at 100% 0%, rgba(99,102,241,0.10), transparent 60%);
  pointer-events: none; z-index: 0;
}

.topbar {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  background: rgba(10,10,15,0.72); border-bottom: 1px solid var(--border);
  padding: 14px 20px; display: flex; align-items: center; gap: 14px;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; letter-spacing: -0.4px; font-size: 1.1rem;
  color: var(--text); text-decoration: none; flex-shrink: 0;
}
.brand .dot {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  display: grid; place-items: center; color: white; font-size: 14px;
  box-shadow: 0 6px 20px var(--brand-glow);
}
.brand span {
  background: linear-gradient(90deg, #fff, #b8b8c8);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.topbar .spacer { flex: 1; }
.btn-ghost {
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  padding: 8px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.2s ease; text-decoration: none;
}
.btn-ghost:hover {
  border-color: var(--border-hover); background: var(--card-2);
  transform: translateY(-1px);
}

.container {
  position: relative; z-index: 1; max-width: 1180px;
  margin: 0 auto; padding: 24px 20px 80px;
}

.hero {
  display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
  gap: 32px; align-items: start; margin-bottom: 40px;
}
@media (max-width: 780px) {
  .hero { grid-template-columns: 1fr; gap: 22px; }
}
.poster-wrap {
  position: relative; aspect-ratio: 2 / 3; border-radius: var(--radius);
  overflow: hidden; background: var(--card); border: 1px solid var(--border);
  box-shadow: 0 24px 60px rgba(0,0,0,0.55);
  cursor: pointer; transition: transform 0.35s cubic-bezier(.2,.7,.2,1);
}
.poster-wrap:hover { transform: translateY(-4px) scale(1.01); border-color: var(--border-hover); }
.poster-wrap img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  user-select: none; -webkit-user-drag: none; pointer-events: none;
}
.poster-wrap::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.72) 100%);
  pointer-events: none;
}
.play-overlay {
  position: absolute; inset: 0; display: grid; place-items: center; z-index: 2;
  opacity: 0; transition: opacity 0.3s ease; background: rgba(0,0,0,0.35);
}
.poster-wrap:hover .play-overlay { opacity: 1; }
.poster-wrap.playing .play-overlay { display: none; }
.play-ring {
  width: 76px; height: 76px; border-radius: 50%;
  background: rgba(255,255,255,0.14);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,0.28);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  transform: scale(0.9); transition: transform 0.3s ease;
}
.poster-wrap:hover .play-ring { transform: scale(1); }
.play-ring i { font-size: 30px; color: white; margin-left: 4px; }

.info { padding-top: 8px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.badge {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px;
  text-transform: uppercase; padding: 5px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--card); color: var(--muted);
}
.badge.brand {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: white; border-color: transparent;
  box-shadow: 0 6px 18px var(--brand-glow);
}
.badge.latest {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #1a1a1a; border-color: transparent;
}
.badge.hd {
  border-color: rgba(16,185,129,0.4); color: var(--success);
  background: rgba(16,185,129,0.08);
}
.title {
  font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800;
  letter-spacing: -0.6px; line-height: 1.15; margin-bottom: 10px;
}
.title-text {
  background: linear-gradient(180deg, #ffffff 0%, #b8b8c8 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.meta-row {
  display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted);
  font-size: 0.88rem; margin-bottom: 18px; align-items: center;
}
.meta-row .dot { color: var(--muted-2); }
.rating { color: var(--gold); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.description {
  color: #c7c7d4; font-size: 0.95rem; line-height: 1.65;
  margin-bottom: 22px; max-width: 62ch;
}
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 26px; }
.btn {
  border: none; font-family: inherit; font-weight: 700; font-size: 0.92rem;
  padding: 12px 22px; border-radius: 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  transition: all 0.22s ease; text-decoration: none; white-space: nowrap;
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: white; box-shadow: 0 10px 28px var(--brand-glow);
}
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 34px var(--brand-glow); }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.price-chip {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 10px 16px; border-radius: 12px;
  background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25);
  color: var(--gold); font-weight: 700;
}
.price-chip small { font-size: 0.72rem; color: var(--muted); font-weight: 600; }
.price-chip.free {
  background: rgba(16,185,129,0.08);
  border-color: rgba(16,185,129,0.28); color: var(--success);
}

.player-section {
  margin-top: 20px; border-radius: var(--radius); overflow: hidden;
  background: #000; border: 1px solid var(--border);
  box-shadow: 0 30px 80px rgba(0,0,0,0.6); display: none;
  animation: fadeUp 0.4s ease;
}
.player-section.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.player-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 14px 18px; background: var(--bg-2);
  border-bottom: 1px solid var(--border);
}
.player-head .p-title {
  font-weight: 700; font-size: 0.95rem; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.player-head .live-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--brand); box-shadow: 0 0 0 0 var(--brand-glow);
  animation: pulse 1.8s infinite; margin-right: 8px; vertical-align: middle;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 var(--brand-glow); }
  70% { box-shadow: 0 0 0 12px rgba(225,29,72,0); }
  100% { box-shadow: 0 0 0 0 rgba(225,29,72,0); }
}
.video-shell { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
.video-shell video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; background: #000;
}
.buffer-overlay {
  position: absolute; inset: 0; display: none; place-items: center;
  background: rgba(0,0,0,0.55); z-index: 5;
  backdrop-filter: blur(4px);
}
.buffer-overlay.show { display: grid; }
.spinner {
  width: 46px; height: 46px; border: 3px solid rgba(255,255,255,0.15);
  border-top-color: var(--brand); border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ════════════════════════════════════════════════════════════
   NEW: CLICK-TO-PLAY OVERLAY
   ════════════════════════════════════════════════════════════ */
.click-to-play-overlay {
  position: absolute; inset: 0; display: none;
  place-items: center; z-index: 6;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  cursor: pointer;
}
.click-to-play-overlay.show { display: grid; }
.click-to-play-btn {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
  padding: 22px 40px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(225,29,72,0.95), rgba(244,63,94,0.95));
  color: white;
  border: none;
  box-shadow: 0 20px 50px var(--brand-glow), 0 0 0 6px rgba(255,255,255,0.06);
  animation: bounceIn 0.4s cubic-bezier(.2,.7,.2,1);
}
.click-to-play-btn:hover { transform: scale(1.05); box-shadow: 0 24px 60px var(--brand-glow); }
.click-to-play-btn i {
  font-size: 42px;
  line-height: 1;
}
.click-to-play-btn span {
  font-size: 0.95rem;
  font-weight: 800;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}
.click-to-play-btn small {
  font-size: 0.72rem;
  font-weight: 600;
  opacity: 0.85;
  letter-spacing: 0.3px;
}
@keyframes bounceIn {
  0% { opacity: 0; transform: scale(0.85); }
  60% { opacity: 1; transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* Retry overlay */
.retry-overlay {
  position: absolute; inset: 0; display: none;
  place-items: center; z-index: 6;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
}
.retry-overlay.show { display: grid; }
.retry-box {
  display: flex; flex-direction: column;
  align-items: center; gap: 14px;
  padding: 26px 32px; border-radius: 16px;
  background: var(--card); border: 1px solid var(--border);
  max-width: 320px; text-align: center;
}
.retry-box i { font-size: 32px; color: var(--brand); }
.retry-box h3 { font-size: 1rem; font-weight: 800; }
.retry-box p { font-size: 0.82rem; color: var(--muted); line-height: 1.5; word-break: break-word; }
.retry-box button {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: white; border: none; padding: 10px 20px;
  border-radius: 10px; font-weight: 700; font-size: 0.85rem;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.retry-box button:hover { transform: translateY(-1px); }

.browse-head { margin-bottom: 26px; }
.browse-head h1 {
  font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800;
  letter-spacing: -0.5px; margin-bottom: 6px;
}
.browse-head p { color: var(--muted); font-size: 0.92rem; }
.film-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 18px;
}
@media (max-width: 600px) {
  .film-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
}
.film-card {
  display: block; text-decoration: none; color: inherit; cursor: pointer;
  transition: transform 0.3s cubic-bezier(.2,.7,.2,1);
}
.film-card:hover { transform: translateY(-6px); }
.film-card .card-poster {
  position: relative; aspect-ratio: 2 / 3; border-radius: 12px;
  overflow: hidden; background: var(--card); border: 1px solid var(--border);
  box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
.film-card:hover .card-poster {
  border-color: var(--border-hover); box-shadow: 0 20px 46px rgba(0,0,0,0.6);
}
.film-card .card-poster img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  user-select: none; -webkit-user-drag: none;
  transition: transform 0.5s ease;
}
.film-card:hover .card-poster img { transform: scale(1.06); }
.film-card .card-poster::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.78) 100%);
  pointer-events: none;
}
.film-card .card-play {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.7);
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(225,29,72,0.92);
  display: grid; place-items: center;
  color: white; font-size: 20px; opacity: 0;
  transition: all 0.3s ease; z-index: 2;
  box-shadow: 0 8px 24px var(--brand-glow);
}
.film-card:hover .card-play { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.film-card .card-badge-top {
  position: absolute; top: 8px; left: 8px; z-index: 2;
  font-size: 0.62rem; font-weight: 800;
  letter-spacing: 0.5px; text-transform: uppercase;
  padding: 4px 8px; border-radius: 6px;
  background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1a1a1a;
}
.film-card .card-badge-price {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  font-size: 0.62rem; font-weight: 800;
  padding: 4px 8px; border-radius: 6px;
  background: rgba(0,0,0,0.72); color: var(--gold);
  backdrop-filter: blur(6px);
}
.film-card .card-badge-price.free { color: var(--success); }
.film-card .card-episode {
  position: absolute; bottom: 8px; right: 8px; z-index: 2;
  font-size: 0.68rem; font-weight: 800;
  padding: 3px 8px; border-radius: 6px;
  background: rgba(0,0,0,0.78); color: white;
  backdrop-filter: blur(6px);
}
.film-card .card-info { padding: 10px 4px 4px; }
.film-card .card-title {
  font-size: 0.86rem; font-weight: 700; line-height: 1.3;
  color: var(--text); margin-bottom: 3px;
  overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.film-card .card-sub {
  font-size: 0.72rem; color: var(--muted);
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
}
.film-card .card-sub .dot { color: var(--muted-2); }

.skeleton {
  background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.sk-poster { aspect-ratio: 2/3; border-radius: var(--radius); }
.sk-line { height: 14px; margin-bottom: 10px; }
.sk-line.w-60 { width: 60%; }
.sk-line.w-80 { width: 80%; }
.sk-line.h-24 { height: 24px; }
.sk-line.h-32 { height: 32px; }

.error-box {
  display: none; text-align: center; padding: 60px 24px;
  border-radius: var(--radius); background: var(--card);
  border: 1px solid var(--border);
}
.error-box.show { display: block; }
.error-box i {
  font-size: 48px; color: var(--brand);
  margin-bottom: 16px; display: block;
}
.error-box h2 { font-size: 1.25rem; margin-bottom: 8px; font-weight: 700; }
.error-box p {
  color: var(--muted); margin-bottom: 20px; font-size: 0.92rem;
  white-space: pre-wrap; word-break: break-word;
}

#toastContainer {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  display: flex; flex-direction: column; gap: 10px; max-width: 340px;
}
.custom-toast {
  background: var(--card); border: 1px solid var(--border);
  border-left: 4px solid var(--brand); border-radius: 12px;
  padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  animation: slideInRight 0.3s ease; color: var(--text);
}
.custom-toast.success { border-left-color: var(--success); }
.custom-toast.error { border-left-color: var(--brand); }
.custom-toast .toast-icon { font-size: 20px; color: var(--success); flex-shrink: 0; }
.custom-toast.error .toast-icon { color: var(--brand); }
.custom-toast .toast-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
.custom-toast .toast-msg {
  font-size: 0.82rem; color: var(--muted);
  white-space: pre-wrap; word-break: break-word;
}
@keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideOutRight { to { opacity: 0; transform: translateX(30px); } }

.dev-banner {
  display: none;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #1a1a1a; padding: 8px 16px; text-align: center;
  font-size: 0.78rem; font-weight: 700;
}
.dev-banner.show { display: block; }

@media (max-width: 600px) {
  .container { padding: 16px 14px 60px; }
  .topbar { padding: 12px 14px; }
  .title { font-size: 1.5rem; }
  .actions .btn { flex: 1; justify-content: center; }
  #toastContainer { left: 12px; right: 12px; max-width: none; }
  .click-to-play-btn { padding: 18px 30px; }
  .click-to-play-btn i { font-size: 34px; }
  .click-to-play-btn span { font-size: 0.85rem; }
}
</style>
</head>
<body>

<div class="dev-banner" id="devBanner">
  <i class="bi bi-tools"></i> Testing Mode — Localhost
</div>

<header class="topbar">
  <a href="/" class="brand">
    <span class="dot"><i class="bi bi-play-fill"></i></span>
    <span>Akimark</span>
  </a>
  <div class="spacer"></div>
  <a href="/" class="btn-ghost" id="backBtn">
    <i class="bi bi-arrow-left"></i> Back
  </a>
</header>

<main class="container">

  <section id="browseSection" style="display:none;">
    <div class="browse-head">
      <h1>Browse Films</h1>
      <p>Dinani pa film kuti muyambe kuwonera</p>
    </div>
    <div class="film-grid" id="filmGrid"></div>
  </section>

  <section class="hero" id="heroSection" style="display:none;">
    <div id="posterCol">
      <div class="poster-wrap skeleton sk-poster" id="posterWrap"></div>
    </div>
    <div class="info" id="infoCol">
      <div class="badges">
        <div class="skeleton sk-line" style="width:80px; height:22px; border-radius:999px;"></div>
        <div class="skeleton sk-line" style="width:60px; height:22px; border-radius:999px;"></div>
      </div>
      <div class="skeleton sk-line h-32 w-80"></div>
      <div class="skeleton sk-line h-24 w-60" style="margin-bottom:20px;"></div>
      <div class="skeleton sk-line w-80"></div>
      <div class="skeleton sk-line w-80"></div>
      <div class="skeleton sk-line w-60" style="margin-bottom:24px;"></div>
      <div class="skeleton" style="width:180px; height:46px; border-radius:12px;"></div>
    </div>
  </section>

  <div class="error-box" id="errorBox">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <h2 id="errorTitle">Something went wrong</h2>
    <p id="errorMessage">We couldn't load this film.</p>
    <button class="btn btn-primary" onclick="location.reload()">
      <i class="bi bi-arrow-clockwise"></i> Try Again
    </button>
  </div>

  <section class="player-section" id="playerSection">
    <div class="player-head">
      <div class="p-title">
        <span class="live-dot"></span>
        <span id="playerTitle">Now Playing</span>
      </div>
      <button class="btn-ghost" id="closePlayerBtn">
        <i class="bi bi-x-lg"></i> Close
      </button>
    </div>
    <div class="video-shell">
      <video
        id="player"
        controls
        controlsList="nodownload noplaybackrate noremoteplayback"
        disablePictureInPicture
        playsinline
        preload="metadata"
        crossorigin="anonymous"
      ></video>

      <!-- Buffer spinner overlay -->
      <div class="buffer-overlay" id="bufferOverlay">
        <div class="spinner"></div>
      </div>

      <!-- ════════════════════════════════════════════════════════
           NEW: Click-to-Play overlay

<script src="javascript/supabase.js"></script>
<script>
/* ============================================================
   AKIMARK WATCH PAGE — secure HLS + AES-128 playback
   WITH: manual play button, longer timeouts, retry UI
   ============================================================ */
(function () {
  'use strict';

  // ════════════════════════════════════════════════════════════
  // CONFIG — timeouts (much longer than 30s)
  // ════════════════════════════════════════════════════════════
  const HLS_MANIFEST_TIMEOUT_MS = 120_000;  // 2 minutes
  const VIDEO_LOAD_TIMEOUT_MS   = 120_000;  // 2 minutes
  const SESSION_REFRESH_BUFFER  = 120;      // refresh 2 min before expiry

  const HOST = location.hostname;
  const IS_DEV =
    HOST === 'localhost' ||
    HOST === '127.0.0.1' ||
    HOST.endsWith('.workers.dev') ||
    HOST.endsWith('.pages.dev');

  if (IS_DEV) document.getElementById('devBanner').classList.add('show');

  // -------- DOM --------
  const browseSection = document.getElementById('browseSection');

  const heroSection   = document.getElementById('heroSection');
  const posterWrap    = document.getElementById('posterWrap');
  const infoCol       = document.getElementById('infoCol');
  const errorBox      = document.getElementById('errorBox');

  const errorMsg      = document.getElementById('errorMessage');
  const playerSec     = document.getElementById('playerSection');
  const playerEl      = document.getElementById('player');
  const playerTitle   = document.getElementById('playerTitle');
  const bufferOv      = document.getElementById('bufferOverlay');
  const closeBtn      = document.getElementById('closePlayerBtn');
  const toastBox      = document.getElementById('toastContainer');
  const backBtn       = document.getElementById('backBtn');

  // NEW DOM
  const clickToPlayOv = document.getElementById('clickToPlayOverlay');
  const clickToPlayBtn = document.getElementById('clickToPlayBtn');
  const retryOv       = document.getElementById('retryOverlay');
  const retryMsg      = document.getElementById('retryMessage');
  const retryBtn      = document.getElementById('retryBtn');

  // -------- SUPABASE --------
  const SUPABASE_URL      = window.SUPABASE_URL;
  const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    document.body.innerHTML = '<div style="padding:40px;color:#fff;font-family:sans-serif;">Configuration missing: javascript/supabase.js not loaded.</div>';
    return;
  }

  // -------- TOAST --------
  function showToast({ type = 'success', title = '', message = '' }) {
    const toast = document.createElement('div');
    toast.className = `custom-toast ${type}`;
    const icon = type === 'success' ? 'bi-check-circle-fill' : 'bi-x-circle-fill';
    toast.innerHTML = `
      <div class="toast-icon"><i class="bi ${icon}"></i></div>
      <div class="toast-content">
        <div class="toast-title">${escapeHtml(title)}</div>
        <div class="toast-msg">${escapeHtml(message)}</div>
      </div>
    `;
    toastBox.appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'slideOutRight 0.35s ease forwards';
      setTimeout(() => toast.remove(), 400);
    }, 6000);
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function showError(title, message) {
    heroSection.style.display = 'none';
    browseSection.style.display = 'none';
    errorBox.classList.add('show');
    errorTitle.textContent = title;
    errorMsg.textContent = message;
  }

  function formatDuration(mins) {
    if (!mins || mins <= 0) return null;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }

  function formatPrice(p) {
    if (!p || p <= 0) return null;
    return `MK ${Number(p).toLocaleString('en-MW')}`;
  }

  function getVideoIdFromURL() {
    const params = new URLSearchParams(location.search);
    return params.get('id') || params.get('video') || params.get('v');
  }

  // ════════════════════════════════════════════════════════════
  // HMAC-SHA256 (browser)
  // ════════════════════════════════════════════════════════════
  async function hmacSha256Hex(secret, message) {
    const key = await crypto.subtle.importKey(
      'raw',
      new TextEncoder().encode(secret),
      { name: 'HMAC', hash: 'SHA-256' },
      false,
      ['sign'],
    );
    const sig = await crypto.subtle.sign(
      'HMAC',
      key,
      new TextEncoder().encode(message),
    );
    return Array.from(new Uint8Array(sig))
      .map((b) => b.toString(16).padStart(2, '0'))
      .join('');
  }

  // ════════════════════════════════════════════════════════════
  // SUPABASE REST
  // ════════════════════════════════════════════════════════════
  const SB_HEADERS = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Accept': 'application/json',
  };

  async function fetchVideo(videoId) {
    const url1 = `${SUPABASE_URL}/rest/v1/videos_public?id=eq.${encodeURIComponent(videoId)}&select=*&limit=1`;
    let res = await fetch(url1, { headers: SB_HEADERS });
    if (!res.ok) {
      const url2 = `${SUPABASE_URL}/rest/v1/videos?id=eq.${encodeURIComponent(videoId)}&select=id,title,genre,year,duration,quality,description,price,poster_url,category,featured,latest,episode_number,series_id,translator_name,view_count,created_at,is_published&limit=1`;
      res = await fetch(url2, { headers: SB_HEADERS });
    }
    if (!res.ok) {
      let bodyText = '';
      try { bodyText = await res.text(); } catch {}
      throw new Error(`Supabase REST error (${res.status})\nBody: ${bodyText.slice(0, 200)}`);
    }
    const rows = await res.json();
    if (!rows || rows.length === 0) throw new Error(`Video not found: ${videoId}`);
    return rows[0];
  }

  async function fetchAllVideos() {
    const url1 = `${SUPABASE_URL}/rest/v1/videos_public?select=*&order=created_at.desc&limit=200`;
    let res = await fetch(url1, { headers: SB_HEADERS });
    if (!res.ok) {
      const url2 = `${SUPABASE_URL}/rest/v1/videos?is_published=eq.true&select=id,title,genre,year,duration,quality,description,price,poster_url,category,featured,latest,episode_number,series_id,translator_name,view_count,created_at&order=created_at.desc&limit=200`;
      res = await fetch(url2, { headers: SB_HEADERS });
    }
    if (!res.ok) {
      let bodyText = '';
      try { bodyText = await res.text(); } catch {}
      throw new Error(`Supabase REST error (${res.status})\nBody: ${bodyText.slice(0, 200)}`);
    }
    return (await res.json()) || [];
  }

  function renderPoster(video) {
    const posterUrl = video.poster_url || '';
    posterWrap.classList.remove('skeleton', 'sk-poster');
    posterWrap.classList.add('poster-wrap');

    if (!posterUrl) {
      posterWrap.style.background = 'linear-gradient(135deg, #1a1a24, #0d0d14)';
      posterWrap.innerHTML = `
        <div style="position:absolute;inset:0;display:grid;place-items:center;color:#3a3a48;font-size:56px;">
          <i class="bi bi-film"></i>
        </div>
        <div class="play-overlay">
          <div class="play-ring"><i class="bi bi-play-fill"></i></div>
        </div>
      `;
      return;
    }

    posterWrap.innerHTML = `
      <img src="${escapeHtml(posterUrl)}" alt="${escapeHtml(video.title)}" loading="eager"
        onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(135deg, #1a1a24, #0d0d14)';" />
      <div class="play-overlay">
        <div class="play-ring"><i class="bi bi-play-fill"></i></div>
      </div>
    `;
  }

  function renderInfo(video) {
    const genres = (video.genre || '').split(',').map(s => s.trim()).filter(Boolean);
    const categories = (video.category || '').split(',').map(s => s.trim()).filter(Boolean);
    const duration = formatDuration(video.duration);
    const price = formatPrice(video.price);

    const badges = [];
    if (video.latest) badges.push(`<span class="badge latest"><i class="bi bi-lightning-fill"></i> Latest</span>`);
    if (video.quality) badges.push(`<span class="badge hd"><i class="bi bi-badge-hd-fill"></i> ${escapeHtml(video.quality)}</span>`);
    if (video.episode_number) badges.push(`<span class="badge">E${escapeHtml(String(video.episode_number))}</span>`);
    categories.slice(0, 3).forEach(c => {
      badges.push(`<span class="badge brand">${escapeHtml(c)}</span>`);
    });

    const metaParts = [];
    if (video.year) metaParts.push(`<span>${escapeHtml(video.year)}</span>`);
    if (duration) metaParts.push(`<span class="dot">•</span><span>${escapeHtml(duration)}</span>`);
    if (genres.length) metaParts.push(`<span class="dot">•</span><span>${escapeHtml(genres.join(' · '))}</span>`);
    if (video.translator_name) metaParts.push(`<span class="dot">•</span><span><i class="bi bi-person-fill"></i> ${escapeHtml(video.translator_name)}</span>`);
    if (video.view_count) metaParts.push(`<span class="dot">•</span><span><i class="bi bi-eye-fill"></i> ${Number(video.view_count).toLocaleString()}</span>`);

    const priceChip = price
      ? `<div class="price-chip"><small>Price</small>${escapeHtml(price)}</div>`
      : `<div class="price-chip free"><i class="bi bi-unlock-fill"></i> Free</div>`;

    infoCol.innerHTML = `
      <div class="badges">${badges.join('')}</div>
      <h1 class="title"><span class="title-text">${escapeHtml(video.title || 'Untitled')}</span></h1>
      <div class="meta-row">
        <span class="rating"><i class="bi bi-star-fill"></i> 8.5</span>
        ${metaParts.join(' ')}
      </div>
      <p class="description">${escapeHtml(video.description || 'No description available for this film.')}</p>
      <div class="actions">
        <button class="btn btn-primary" id="playBtn"><i class="bi bi-play-fill"></i> Play Now</button>
        ${priceChip}
      </div>
    `;

    document.getElementById('playBtn').addEventListener('click', () => startPlayback(video));
    posterWrap.addEventListener('click', () => startPlayback(video), { once: false });
  }

  function renderBrowseGrid(videos) {
    if (!videos.length) {
      filmGrid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);">
          <i class="bi bi-film" style="font-size:48px;display:block;margin-bottom:12px;opacity:0.4;"></i>
          <p>Palibe ma films pano panthawi ino.</p>
        </div>
      `;
      return;
    }

    filmGrid.innerHTML = videos.map(v => {
      const price = formatPrice(v.price);
      const priceClass = price ? 'card-badge-price' : 'card-badge-price free';
      const priceText = price || 'FREE';
      const year = v.year || '';
      const quality = v.quality || 'HD';
      const episodeBadge = v.episode_number
        ? `<span class="card-episode">E${escapeHtml(String(v.episode_number))}</span>`
        : '';
      const latestBadge = v.latest
        ? `<span class="card-badge-top"><i class="bi bi-lightning-fill"></i> New</span>`
        : '';
      const posterUrl = v.poster_url || '';
      const posterHtml = posterUrl
        ? `<img src="${escapeHtml(posterUrl)}" alt="${escapeHtml(v.title)}" loading="lazy"
             onerror="this.style.display='none';" />`
        : `<div style="position:absolute;inset:0;display:grid;place-items:center;color:#3a3a48;font-size:40px;"><i class="bi bi-film"></i></div>`;

      return `
        <a class="film-card" href="?id=${encodeURIComponent(v.id)}" data-id="${escapeHtml(v.id)}">
          <div class="card-poster">
            ${latestBadge}
            <span class="${priceClass}">${escapeHtml(priceText)}</span>
            ${posterHtml}
            ${episodeBadge}
            <div class="card-play"><i class="bi bi-play-fill"></i></div>
          </div>
          <div class="card-info">
            <div class="card-title">${escapeHtml(v.title || 'Untitled')}</div>
            <div class="card-sub">
              ${year ? `<span>${escapeHtml(year)}</span><span class="dot">•</span>` : ''}
              <span>${escapeHtml(quality)}</span>
            </div>
          </div>
        </a>
      `;
    }).join('');

    filmGrid.querySelectorAll('.film-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
        e.preventDefault();
        const id = card.getAttribute('data-id');
        if (!id) return;
        history.pushState({}, '', `?id=${encodeURIComponent(id)}`);
        loadWatchMode(id);
      });
    });
  }

  function renderBrowseSkeletons(count = 12) {
    filmGrid.innerHTML = Array.from({ length: count }).map(() => `
      <div class="film-card">
        <div class="card-poster skeleton"></div>
        <div class="card-info">
          <div class="skeleton" style="height:12px;margin-bottom:6px;"></div>
          <div class="skeleton" style="height:12px;width:60%;"></div>
        </div>
      </div>
    `).join('');
  }

  // ════════════════════════════════════════════════════════════
  // PLAYER SESSION
  // ════════════════════════════════════════════════════════════
  const userToken = localStorage.getItem('akmark_token');

  async function getStreamSession(videoId) {
    const res = await fetch(
      `${SUPABASE_URL}/functions/v1/player-session-api`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          ...(userToken ? { 'X-User-Token': userToken } : {}),
        },
        body: JSON.stringify({ video_id: videoId }),
      }
    );
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = { error: text }; }
    if (!res.ok) {
      throw new Error(
        `Session API (${res.status})\n` +
        (data.stage ? `Stage: ${data.stage}\n` : '') +
        (data.error ? `Error: ${data.error}\n` : '') +
        (data.message ? `Message: ${data.message}\n` : '') +
        (data.missing ? `Missing: ${JSON.stringify(data.missing)}\n` : '') +
        (data.hint ? `Hint: ${data.hint}` : '')
      );
    }
    return data;
  }

  // ════════════════════════════════════════════════════════════
  // HLS — CUSTOM SIGNED LOADER
  // ════════════════════════════════════════════════════════════
  let hlsInstance = null;
  let currentClientKey = null;

  function destroyHls() {
    if (hlsInstance) {
      try { hlsInstance.destroy(); } catch {}
      hlsInstance = null;
    }
  }

  function createSignedLoader() {
    const BaseLoader = Hls.DefaultConfig.loader;

    return class SignedLoader extends BaseLoader {
      load(context, config, callbacks) {
        const baseLoad = BaseLoader.prototype.load;
        const clientKey = currentClientKey;

        if (!clientKey) {
          return baseLoad.call(this, context, config, callbacks);
        }

        try {
          const u = new URL(context.url, location.origin);
          const ts = Math.floor(Date.now() / 1000);
          const message = `GET\n${u.pathname}\n${u.search}\n${ts}`;

          hmacSha256Hex(clientKey, message)
            .then((sig) => {
              context.headers = context.headers || {};
              context.headers['X-Client-Key'] = clientKey;
              context.headers['X-Timestamp'] = String(ts);
              context.headers['X-Signature'] = sig;
              baseLoad.call(this, context, config, callbacks);
            })
            .catch((err) => {
              console.error('[SignedLoader] HMAC error:', err);
              baseLoad.call(this, context, config, callbacks);
            });
        } catch (err) {
          console.error('[SignedLoader] setup error:', err);
          baseLoad.call(this, context, config, callbacks);
        }
      }
    };
  }

  function attachHls(url) {
    destroyHls();

    if (window.Hls && Hls.isSupported()) {
      const SignedLoader = createSignedLoader();

      hlsInstance = new Hls({
        enableWorker: false,
        lowLatencyMode: false,
        loader: SignedLoader,
        // ════════════════════════════════════════════════════════
        // FAST + FORGIVING LOADING SETTINGS
        // ════════════════════════════════════════════════════════
        manifestLoadingTimeOut: 120000,
        manifestLoadingMaxRetry: 4,
        manifestLoadingRetryDelay: 1000,
        levelLoadingTimeOut: 120000,
        levelLoadingMaxRetry: 4,
        fragLoadingTimeOut: 120000,
        fragLoadingMaxRetry: 6,
        // Small buffer → start playing quickly
        maxBufferLength: 20,
        maxMaxBufferLength: 60,
        maxBufferSize: 60 * 1000 * 1000,
        backBufferLength: 30,
      });

      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(playerEl);

      return new Promise((resolve, reject) => {
        let settled = false;
        const settle = (fn, val) => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          fn(val);
        };
        const timeout = setTimeout(
          () => settle(reject, new Error(
            `HLS manifest timeout (${HLS_MANIFEST_TIMEOUT_MS / 1000}s). ` +
            `Please check your connection and try again.`
          )),
          HLS_MANIFEST_TIMEOUT_MS,
        );

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => settle(resolve));
        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
          console.error('[HLS] Error:', data);
          if (data.fatal) {
            let msg = `HLS error: ${data.details} (${data.type})`;
            if (data.response) msg += ` [HTTP ${data.response.code}]`;
            settle(reject, new Error(msg));
          }
        });
      });
    } else if (playerEl.canPlayType('application/vnd.apple.mpegurl')) {
      playerEl.src = url;
      playerEl.load();
      return Promise.resolve();
    } else {
      return Promise.reject(new Error('HLS is not supported in this browser'));
    }
  }

  // ════════════════════════════════════════════════════════════
  // OVERLAY HELPERS
  // ════════════════════════════════════════════════════════════
  function showClickToPlay() {
    clickToPlayOv.classList.add('show');
    bufferOv.classList.remove('show');
    retryOv.classList.remove('show');
  }
  function hideClickToPlay() {
    clickToPlayOv.classList.remove('show');
  }
  function showRetry(message) {
    retryMsg.textContent = message || 'Something went wrong.';
    retryOv.classList.add('show');
    bufferOv.classList.remove('show');
    clickToPlayOv.classList.remove('show');
  }
  function hideRetry() {
    retryOv.classList.remove('show');
  }

  // ════════════════════════════════════════════════════════════
  // START PLAYBACK — prepare but DON'T auto-play
  // ════════════════════════════════════════════════════════════
  let sessionRefreshTimer = null;
  let currentVideoId = null;
  let currentVideoObj = null;
  let currentStreamUrl = null;

  async function startPlayback(video) {
    if (currentVideoId === video.id && playerSec.classList.contains('active')) {
      // Already prepared; just show click-to-play if paused
      if (playerEl.paused) showClickToPlay();
      return;
    }

    currentVideoObj = video;

    const playBtn = document.getElementById('playBtn');
    if (playBtn) {
      playBtn.disabled = true;
      playBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Loading...';
    }

    hideClickToPlay();
    hideRetry();
    bufferOv.classList.add('show');
    playerSec.classList.add('active');
    playerTitle.textContent = video.title || 'Now Playing';

    setTimeout(() => {
      playerSec.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);

    try {
      console.log('[Akimark] Requesting session…');
      const session = await getStreamSession(video.id);
      console.log('[Akimark] Session OK. expiresIn:', session.expiresIn);

      currentClientKey = session.clientKey || null;
      if (!currentClientKey) throw new Error('Server did not return clientKey');

      currentStreamUrl = session.streamUrl;

      if (video.poster_url) playerEl.poster = video.poster_url;

      await attachHls(session.streamUrl);

      // HLS is loaded. Show click-to-play. User clicks to start.
      bufferOv.classList.remove('show');
      showClickToPlay();

      currentVideoId = video.id;
      scheduleSessionRefresh(video.id, session.expiresIn);

      showToast({
        type: 'success',
        title: 'Ready to play',
        message: `Tap the play button to start "${video.title}"`,
      });

      if (playBtn) {
        playBtn.disabled = false;
        playBtn.innerHTML = '<i class="bi bi-play-fill"></i> Play Now';
      }
    } catch (err) {
      console.error('[Akimark] Playback error:', err);
      destroyHls();
      currentClientKey = null;
      bufferOv.classList.remove('show');
      showRetry(err.message || 'Could not prepare video.');

      if (playBtn) {
        playBtn.disabled = false;
        playBtn.innerHTML = '<i class="bi bi-play-fill"></i> Play Now';
      }
    }
  }

  // ════════════════════════════════════════════════════════════
  // CLICK-TO-PLAY HANDLER
  // ════════════════════════════════════════════════════════════
  clickToPlayBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    hideClickToPlay();
    bufferOv.classList.add('show');

    try {
      await playerEl.play();
      // play event will hide buffer
    } catch (err) {
      console.error('[Akimark] Play failed:', err);
      bufferOv.classList.remove('show');
      showRetry('Could not start playback. Tap retry.');
    }
  });

  // Also allow clicking the overlay anywhere
  clickToPlayOv.addEventListener('click', (e) => {
    if (e.target === clickToPlayOv) clickToPlayBtn.click();
  });

  // ════════════════════════════════════════════════════════════
  // RETRY HANDLER
  // ════════════════════════════════════════════════════════════
  retryBtn.addEventListener('click', () => {
    hideRetry();
    if (currentVideoObj) {
      // Reset state and try again
      currentVideoId = null;
      startPlayback(currentVideoObj);
    }
  });

  function scheduleSessionRefresh(videoId, expiresIn) {
    if (sessionRefreshTimer) clearTimeout(sessionRefreshTimer);
    const refreshMs = Math.max((expiresIn - SESSION_REFRESH_BUFFER) * 1000, 60_000);

    sessionRefreshTimer = setTimeout(async () => {
      try {
        console.log('[Akimark] Refreshing session…');
        const fresh = await getStreamSession(videoId);
        currentClientKey = fresh.clientKey;
        const wasPlaying = !playerEl.paused;
        const curTime = playerEl.currentTime;
        const wasMuted = playerEl.muted;

        await attachHls(fresh.streamUrl);
        await new Promise((res) => {
          const on = () => { playerEl.removeEventListener('loadedmetadata', on); res(); };
          playerEl.addEventListener('loadedmetadata', on);
          setTimeout(res, 5000);
        });
        try { playerEl.currentTime = curTime; } catch {}
        playerEl.muted = wasMuted;

        if (wasPlaying) { try { await playerEl.play(); } catch {} }

        scheduleSessionRefresh(videoId, fresh.expiresIn);
      } catch (e) {
        console.error('Session refresh failed:', e);
        sessionRefreshTimer = setTimeout(
          () => scheduleSessionRefresh(videoId, 1800),
          60_000,
        );
      }
    }, refreshMs);
  }

  // ════════════════════════════════════════════════════════════
  // CLOSE PLAYER
  // ════════════════════════════════════════════════════════════
  closeBtn.addEventListener('click', () => {
    try { playerEl.pause(); } catch {}
    destroyHls();
    currentClientKey = null;
    playerEl.removeAttribute('src');
    playerEl.load();
    if (sessionRefreshTimer) {
      clearTimeout(sessionRefreshTimer);
      sessionRefreshTimer = null;
    }
    hideClickToPlay();
    hideRetry();
    bufferOv.classList.remove('show');
    playerSec.classList.remove('active');
    posterWrap.classList.remove('playing');
    currentVideoId = null;
  });

  // Video events — hide spinner during play, show spinner on buffer
  playerEl.addEventListener('waiting', () => bufferOv.classList.add('show'));
  playerEl.addEventListener('playing', () => {
    bufferOv.classList.remove('show');
    hideClickToPlay();
    posterWrap.classList.add('playing');
  });
  playerEl.addEventListener('canplay', () => {
    bufferOv.classList.remove('show');
  });
  playerEl.addEventListener('pause', () => {
    // Only show click-to-play when video ended or user paused after start
    if (playerEl.currentTime > 0 && !playerEl.ended) {
      // do nothing — normal pause
    }
  });
  playerEl.addEventListener('ended', () => {
    showClickToPlay();
  });

  // ════════════════════════════════════════════════════════════
  // MODE LOADERS
  // ════════════════════════════════════════════════════════════
  async function loadWatchMode(videoId) {
    browseSection.style.display = 'none';
    heroSection.style.display = '';
    errorBox.classList.remove('show');

    try {
      const video = await fetchVideo(videoId);
      document.title = `${video.title} — Akimark`;
      renderPoster(video);
      renderInfo(video);

      if (new URLSearchParams(location.search).get('autoplay') === '1') {
        // Auto-prepare, but still require click-to-play
        startPlayback(video);
      }
    } catch (err) {
      console.error('[Akimark] loadWatchMode error:', err);
      showError('Film not found', err.message || 'We could not find this film.');
    }
  }

  async function loadBrowseMode() {
    browseSection.style.display = '';
    heroSection.style.display = 'none';
    errorBox.classList.remove('show');
    document.title = 'Akimark — Watch';

    renderBrowseSkeletons(12);

    try {
      const videos = await fetchAllVideos();
      renderBrowseGrid(videos);
    } catch (err) {
      console.error('[Akimark] loadBrowseMode error:', err);
      filmGrid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);">
          <i class="bi bi-exclamation-triangle-fill" style="font-size:48px;display:block;margin-bottom:12px;color:var(--brand);"></i>
          <p style="margin-bottom:16px;white-space:pre-wrap;word-break:break-word;">${escapeHtml(err.message || 'Failed to load films')}</p>
          <button class="btn btn-primary" onclick="location.reload()">
            <i class="bi bi-arrow-clockwise"></i> Try Again
          </button>
        </div>
      `;
    }
  }

  window.addEventListener('popstate', () => {
    const id = getVideoIdFromURL();
    if (id) loadWatchMode(id);
    else loadBrowseMode();
  });

  backBtn.addEventListener('click', (e) => {
    if (getVideoIdFromURL()) {
      e.preventDefault();
      history.pushState({}, '', location.pathname);
      loadBrowseMode();
    }
  });

  const videoId = getVideoIdFromURL();
  if (videoId) {
    loadWatchMode(videoId);
  } else {
    loadBrowseMode();
  }
})();
</script>
</body>
</html>
